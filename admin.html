<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY WORDS 管理画面</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px;
  background: #f5f7fb;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: #263247;
}

.app {
  max-width: 1250px;
  margin: auto;
}

/* ------------------
   HEADER
------------------- */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 22px;
}

.logo {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 1px;
}

.logo span {
  color: #778398;
  font-size: 22px;
  margin-left: 8px;
}

.nav {
  display: flex;
  gap: 10px;
}

.nav a {
  text-decoration: none;
  padding: 12px 18px;
  border-radius: 14px;
  background: white;
  color: #263247;
  font-weight: bold;
  box-shadow: 0 2px 9px rgba(0,0,0,.06);
}

.nav .active {
  background: #ffdce4;
}

/* ------------------
   2カラム
------------------- */

.main {
  display: grid;
  grid-template-columns:
    minmax(360px, 42%)
    minmax(500px, 58%);
  gap: 22px;
  align-items: start;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 26px;
  box-shadow:
    0 5px 22px rgba(45,60,90,.08);
}

h2 {
  margin-top: 0;
}

.section-title {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 24px;
}

/* ------------------
   INPUT
------------------- */

label {
  display: block;
  font-weight: bold;
  margin: 16px 0 7px;
}

input,
select {
  width: 100%;
  padding: 13px 14px;
  border-radius: 12px;
  border: 1px solid #ccd3df;
  font-size: 17px;
  background: white;
}

input:focus,
select:focus {
  outline: none;
  border-color: #4285e5;
  box-shadow: 0 0 0 3px rgba(66,133,229,.12);
}

.hint {
  margin-top: 5px;
  font-size: 13px;
  color: #7b8494;
}

/* ------------------
   品詞ごとのBOX
------------------- */

.forms-box {
  margin-top: 20px;
  padding: 20px;
  border-radius: 18px;
}

.verb-box {
  background: #fff0f3;
}

.adjective-box {
  background: #edfaf1;
}

.normal-box {
  background: #eef6ff;
}

.forms-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 12px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 14px;
}

.form-field label {
  font-size: 14px;
  margin: 6px 0;
}

.optional {
  color: #8a94a5;
  font-size: 12px;
  font-weight: normal;
}

/* ------------------
   BUTTON
------------------- */

.register-button {
  width: 100%;
  margin-top: 22px;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: #357ee8;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.cancel-button {
  display: none;
  width: 100%;
  margin-top: 9px;
  padding: 13px;
  border: 0;
  border-radius: 14px;
  background: #e7e9ee;
  font-size: 16px;
}

/* ------------------
   一覧
------------------- */

.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}

.toolbar input {
  flex: 1;
}

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.filter-button {
  border: 0;
  background: #edf0f5;
  padding: 9px 14px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
}

.filter-button.active {
  background: #357ee8;
  color: white;
}

.count {
  font-size: 14px;
  color: #788294;
  margin-bottom: 12px;
}

.word-table {
  width: 100%;
  border-collapse: collapse;
}

.word-table th {
  text-align: left;
  padding: 12px;
  background: #f4f6f9;
  font-size: 14px;
}

.word-table td {
  padding: 13px 12px;
  border-bottom: 1px solid #e8ebf0;
  vertical-align: middle;
}

.english {
  font-size: 18px;
  font-weight: bold;
}

.subforms {
  margin-top: 4px;
  color: #727d8e;
  font-size: 12px;
  line-height: 1.5;
}

.badge {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: bold;
}

.badge-verb {
  background: #ffe2e8;
  color: #d54762;
}

.badge-noun {
  background: #e3f2ff;
  color: #2475be;
}

.badge-adjective {
  background: #dff6e7;
  color: #278449;
}

.badge-other {
  background: #eeeef2;
  color: #697283;
}

.actions {
  display: flex;
  gap: 6px;
}

.edit-button,
.delete-button {
  border: none;
  border-radius: 10px;
  padding: 8px 10px;
  cursor: pointer;
}

.edit-button {
  background: #e7efff;
}

.delete-button {
  background: #ffe5e8;
}

.empty {
  text-align: center;
  color: #8490a0;
  padding: 40px;
}

/* ------------------
   iPad縦 / スマホ
------------------- */

@media (max-width: 900px) {

  body {
    padding: 16px;
  }

  .header {
    display: block;
  }

  .nav {
    margin-top: 15px;
  }

  .main {
    grid-template-columns: 1fr;
  }

}

@media (max-width: 600px) {

  .form-grid {
    grid-template-columns: 1fr;
  }

  .word-table th:nth-child(3),
  .word-table td:nth-child(3) {
    display: none;
  }

}

</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">
      MY WORDS
      <span>管理画面</span>
    </div>

    <div class="nav">
      <a href="index.html">
        📖 学習
      </a>

      <a href="test.html">
        ✏️ テスト
      </a>

      <a
        href="admin.html"
        class="active">
        ⚙️ 管理
      </a>
    </div>

  </div>


  <div class="main">

    <!-- ==================================
         左：単語登録
    =================================== -->

    <div class="card">

      <div
        id="formTitle"
        class="section-title">
        ＋ 新しい単語を追加
      </div>


      <label>
        日本語（意味）
      </label>

      <input
        id="japanese"
        type="text"
        lang="ja"
        placeholder="例：行く">


      <label>
        品詞
      </label>

      <select
        id="partOfSpeech"
        onchange="changePartOfSpeech()">

        <option value="noun">
          名詞
        </option>

        <option value="verb">
          動詞
        </option>

        <option value="adjective">
          形容詞
        </option>

        <option value="other">
          その他・未分類
        </option>

      </select>


      <!-- 名詞・その他 -->

      <div
        id="normalForms"
        class="forms-box normal-box">

        <div class="forms-title">
          英単語
        </div>

        <label>
          基本の形
        </label>

        <input
          id="normalBase"
          lang="en"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          placeholder="例：apple">

      </div>


      <!-- 動詞 -->

      <div
        id="verbForms"
        class="forms-box verb-box"
        style="display:none;">

        <div class="forms-title">
          動詞の変化
        </div>

        <div class="form-grid">

          <div class="form-field">

            <label>
              原形
            </label>

            <input
              id="verbBase"
              placeholder="go">

          </div>

          <div class="form-field">

            <label>
              過去形
              <span class="optional">
                任意
              </span>
            </label>

            <input
              id="verbPast"
              placeholder="went">

          </div>

          <div class="form-field">

            <label>
              過去分詞
              <span class="optional">
                任意
              </span>
            </label>

            <input
              id="verbPastParticiple"
              placeholder="gone">

          </div>

          <div class="form-field">

            <label>
              ing形
              <span class="optional">
                任意
              </span>
            </label>

            <input
              id="verbIng"
              placeholder="going">

          </div>

          <div class="form-field">

            <label>
              三人称単数現在
              <span class="optional">
                任意
              </span>
            </label>

            <input
              id="verbThirdPerson"
              placeholder="goes">

          </div>

        </div>

      </div>


      <!-- 形容詞 -->

      <div
        id="adjectiveForms"
        class="forms-box adjective-box"
        style="display:none;">

        <div class="forms-title">
          形容詞の変化
        </div>

        <div class="form-grid">

          <div class="form-field">

            <label>
              原級
            </label>

            <input
              id="adjectiveBase"
              placeholder="big">

          </div>

          <div class="form-field">

            <label>
              比較級
              <span class="optional">
                任意
              </span>
            </label>

            <input
              id="comparative"
              placeholder="bigger">

          </div>

          <div class="form-field">

            <label>
              最上級
              <span class="optional">
                任意
              </span>
            </label>

            <input
              id="superlative"
              placeholder="biggest">

          </div>

        </div>

      </div>


      <button
        id="saveButton"
        class="register-button"
        onclick="saveWord()">
        ＋ この単語を登録する
      </button>

      <button
        id="cancelButton"
        class="cancel-button"
        onclick="cancelEdit()">
        編集をキャンセル
      </button>

    </div>


    <!-- ==================================
         右：一覧
    =================================== -->

    <div class="card">

      <div class="section-title">
        登録済みの単語
      </div>

      <div class="toolbar">

        <input
          id="search"
          placeholder="日本語または英単語で検索"
          oninput="showWords()">

      </div>

      <div class="filters">

        <button
          class="filter-button active"
          data-filter="all"
          onclick="setFilter('all',this)">
          すべて
        </button>

        <button
          class="filter-button"
          data-filter="noun"
          onclick="setFilter('noun',this)">
          名詞
        </button>

        <button
          class="filter-button"
          data-filter="verb"
          onclick="setFilter('verb',this)">
          動詞
        </button>

        <button
          class="filter-button"
          data-filter="adjective"
          onclick="setFilter('adjective',this)">
          形容詞
        </button>

        <button
          class="filter-button"
          data-filter="other"
          onclick="setFilter('other',this)">
          その他
        </button>

      </div>

      <div
        id="count"
        class="count">
      </div>

      <div id="wordList"></div>

    </div>

  </div>

</div>


<script>

/* ==================================================
   既存データを読み込む
================================================== */

let words =
  JSON.parse(
    localStorage.getItem("words")
  ) || [];


/* ==================================================
   古いデータを新形式に自動変換

   古い：
   {
     english:"apple",
     japanese:"りんご"
   }

   ↓

   新形式：
   {
     english:"apple",
     japanese:"りんご",
     partOfSpeech:"other",
     forms:{
       base:"apple"
     }
   }

   english は残すので
   既存の学習・テスト画面も動きます。
================================================== */

let dataChanged = false;

words = words.map(function(word) {

  if (!word.partOfSpeech) {

    word.partOfSpeech =
      "other";

    dataChanged = true;

  }

  if (!word.forms) {

    word.forms = {
      base:
        word.english || ""
    };

    dataChanged = true;

  }

  return word;

});


if (dataChanged) {

  saveData();

}


/* ==================================================
   状態
================================================== */

let editingIndex = null;

let currentFilter = "all";


/* ==================================================
   保存
================================================== */

function saveData() {

  localStorage.setItem(
    "words",
    JSON.stringify(words)
  );

}


/* ==================================================
   英語を整える
================================================== */

function normalizeEnglish(text) {

  return (text || "")

    .replace(
      /[Ａ-Ｚａ-ｚ０-９]/g,
      function(character) {

        return String.fromCharCode(
          character.charCodeAt(0)
          - 0xFEE0
        );

      }
    )

    .replace(/　/g," ")

    .trim()

    .toLowerCase();

}


/* ==================================================
   品詞変更
================================================== */

function changePartOfSpeech() {

  const part =
    document
      .getElementById(
        "partOfSpeech"
      )
      .value;


  document
    .getElementById(
      "normalForms"
    )
    .style.display =
      (
        part === "noun"
        ||
        part === "other"
      )
      ? "block"
      : "none";


  document
    .getElementById(
      "verbForms"
    )
    .style.display =
      part === "verb"
      ? "block"
      : "none";


  document
    .getElementById(
      "adjectiveForms"
    )
    .style.display =
      part === "adjective"
      ? "block"
      : "none";

}


/* ==================================================
   登録
================================================== */

function saveWord() {

  const japanese =
    document
      .getElementById("japanese")
      .value
      .trim();


  const part =
    document
      .getElementById(
        "partOfSpeech"
      )
      .value;


  if (!japanese) {

    alert(
      "日本語を入力してください"
    );

    return;

  }


  let english = "";

  let forms = {};


  /* ----------
     動詞
  ---------- */

  if (part === "verb") {

    const base =
      normalizeEnglish(
        document
          .getElementById(
            "verbBase"
          )
          .value
      );


    if (!base) {

      alert(
        "動詞の原形を入力してください"
      );

      return;

    }


    forms = {

      base: base,

      past:
        normalizeEnglish(
          document
            .getElementById(
              "verbPast"
            )
            .value
        ),

      pastParticiple:
        normalizeEnglish(
          document
            .getElementById(
              "verbPastParticiple"
            )
            .value
        ),

      ing:
        normalizeEnglish(
          document
            .getElementById(
              "verbIng"
            )
            .value
        ),

      thirdPerson:
        normalizeEnglish(
          document
            .getElementById(
              "verbThirdPerson"
            )
            .value
        )

    };


    english = base;

  }


  /* ----------
     形容詞
  ---------- */

  else if (
    part === "adjective"
  ) {

    const base =
      normalizeEnglish(
        document
          .getElementById(
            "adjectiveBase"
          )
          .value
      );


    if (!base) {

      alert(
        "形容詞の原級を入力してください"
      );

      return;

    }


    forms = {

      base: base,

      comparative:
        normalizeEnglish(
          document
            .getElementById(
              "comparative"
            )
            .value
        ),

      superlative:
        normalizeEnglish(
          document
            .getElementById(
              "superlative"
            )
            .value
        )

    };


    english = base;

  }


  /* ----------
     名詞・その他
  ---------- */

  else {

    const base =
      normalizeEnglish(
        document
          .getElementById(
            "normalBase"
          )
          .value
      );


    if (!base) {

      alert(
        "英単語を入力してください"
      );

      return;

    }


    forms = {
      base: base
    };


    english = base;

  }


  const newWord = {

    english: english,

    japanese: japanese,

    partOfSpeech: part,

    forms: forms

  };


  if (
    editingIndex === null
  ) {

    words.push(
      newWord
    );

  } else {

    words[
      editingIndex
    ] = newWord;

  }


  saveData();

  clearForm();

  showWords();

}


/* ==================================================
   一覧
================================================== */

function showWords() {

  const list =
    document.getElementById(
      "wordList"
    );


  const search =
    document.getElementById(
      "search"
    )
    .value
    .toLowerCase()
    .trim();


  let filtered =
    words
      .map(function(word,index) {

        return {
          word: word,
          originalIndex: index
        };

      });


  /* 品詞 */

  if (
    currentFilter !== "all"
  ) {

    filtered =
      filtered.filter(
        function(item) {

          return (
            item.word
              .partOfSpeech
            ===
            currentFilter
          );

        }
      );

  }


  /* 検索 */

  if (search) {

    filtered =
      filtered.filter(
        function(item) {

          const word =
            item.word;


          const allForms =
            Object
              .values(
                word.forms || {}
              )
              .join(" ")
              .toLowerCase();


          return (
            (
              word.japanese || ""
            )
            .toLowerCase()
            .includes(search)

            ||

            (
              word.english || ""
            )
            .toLowerCase()
            .includes(search)

            ||

            allForms.includes(
              search
            )
          );

        }
      );

  }


  document
    .getElementById("count")
    .textContent =
      "全 " +
      filtered.length +
      " 件";


  if (
    filtered.length === 0
  ) {

    list.innerHTML =
      '<div class="empty">該当する単語がありません</div>';

    return;

  }


  let html = `

    <table class="word-table">

      <thead>

        <tr>
          <th>日本語</th>
          <th>英単語</th>
          <th>品詞</th>
          <th>操作</th>
        </tr>

      </thead>

      <tbody>

  `;


  filtered.forEach(
    function(item) {

      const word =
        item.word;


      const index =
        item.originalIndex;


      html += `

        <tr>

          <td>
            ${escapeHTML(
              word.japanese
            )}
          </td>

          <td>

            <div class="english">
              ${escapeHTML(
                word.english
              )}
            </div>

            ${getFormsDisplay(
              word
            )}

          </td>

          <td>
            ${getBadge(
              word.partOfSpeech
            )}
          </td>

          <td>

            <div class="actions">

              <button
                class="edit-button"
                onclick="editWord(${index})">
                ✎
              </button>

              <button
                class="delete-button"
                onclick="deleteWord(${index})">
                🗑
              </button>

            </div>

          </td>

        </tr>

      `;

    }
  );


  html += `
      </tbody>
    </table>
  `;


  list.innerHTML =
    html;

}


/* ==================================================
   活用表示
================================================== */

function getFormsDisplay(
  word
) {

  const f =
    word.forms || {};


  let parts = [];


  if (
    word.partOfSpeech
    === "verb"
  ) {

    if (f.past) {

      parts.push(
        "過去: "
        + escapeHTML(f.past)
      );

    }

    if (
      f.pastParticiple
    ) {

      parts.push(
        "過去分詞: "
        +
        escapeHTML(
          f.pastParticiple
        )
      );

    }

    if (f.ing) {

      parts.push(
        "ing: "
        +
        escapeHTML(f.ing)
      );

    }

    if (
      f.thirdPerson
    ) {

      parts.push(
        "三単現: "
        +
        escapeHTML(
          f.thirdPerson
        )
      );

    }

  }


  if (
    word.partOfSpeech
    === "adjective"
  ) {

    if (
      f.comparative
    ) {

      parts.push(
        "比較級: "
        +
        escapeHTML(
          f.comparative
        )
      );

    }

    if (
      f.superlative
    ) {

      parts.push(
        "最上級: "
        +
        escapeHTML(
          f.superlative
        )
      );

    }

  }


  if (
    parts.length === 0
  ) {

    return "";

  }


  return `

    <div class="subforms">
      ${parts.join("　")}
    </div>

  `;

}


/* ==================================================
   品詞ラベル
================================================== */

function getBadge(
  part
) {

  if (part === "verb") {

    return `
      <span class="badge badge-verb">
        動詞
      </span>
    `;

  }


  if (part === "noun") {

    return `
      <span class="badge badge-noun">
        名詞
      </span>
    `;

  }


  if (
    part === "adjective"
  ) {

    return `
      <span class="badge badge-adjective">
        形容詞
      </span>
    `;

  }


  return `
    <span class="badge badge-other">
      その他
    </span>
  `;

}


/* ==================================================
   絞り込み
================================================== */

function setFilter(
  filter,
  button
) {

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".filter-button"
    )
    .forEach(
      function(btn) {

        btn
          .classList
          .remove(
            "active"
          );

      }
    );


  button
    .classList
    .add(
      "active"
    );


  showWords();

}


/* ==================================================
   編集
================================================== */

function editWord(index) {

  const word =
    words[index];


  editingIndex =
    index;


  document
    .getElementById(
      "japanese"
    )
    .value =
      word.japanese || "";


  document
    .getElementById(
      "partOfSpeech"
    )
    .value =
      word.partOfSpeech
      || "other";


  changePartOfSpeech();


  const f =
    word.forms || {};


  clearInputFields();


  if (
    word.partOfSpeech
    === "verb"
  ) {

    document
      .getElementById(
        "verbBase"
      )
      .value =
        f.base
        || word.english
        || "";


    document
      .getElementById(
        "verbPast"
      )
      .value =
        f.past || "";


    document
      .getElementById(
        "verbPastParticiple"
      )
      .value =
        f.pastParticiple
        || "";


    document
      .getElementById(
        "verbIng"
      )
      .value =
        f.ing || "";


    document
      .getElementById(
        "verbThirdPerson"
      )
      .value =
        f.thirdPerson
        || "";

  }


  else if (
    word.partOfSpeech
    === "adjective"
  ) {

    document
      .getElementById(
        "adjectiveBase"
      )
      .value =
        f.base
        || word.english
        || "";


    document
      .getElementById(
        "comparative"
      )
      .value =
        f.comparative
        || "";


    document
      .getElementById(
        "superlative"
      )
      .value =
        f.superlative
        || "";

  }


  else {

    document
      .getElementById(
        "normalBase"
      )
      .value =
        f.base
        || word.english
        || "";

  }


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
      "✎ 単語を編集";


  document
    .getElementById(
      "saveButton"
    )
    .textContent =
      "変更を保存";


  document
    .getElementById(
      "cancelButton"
    )
    .style.display =
      "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ==================================================
   削除
================================================== */

function deleteWord(index) {

  if (
    !confirm(
      words[index].english
      +
      " を削除しますか？"
    )
  ) {

    return;

  }


  words.splice(
    index,
    1
  );


  saveData();

  showWords();

}


/* ==================================================
   キャンセル
================================================== */

function cancelEdit() {

  clearForm();

}


/* ==================================================
   入力欄クリア
================================================== */

function clearInputFields() {

  [
    "normalBase",
    "verbBase",
    "verbPast",
    "verbPastParticiple",
    "verbIng",
    "verbThirdPerson",
    "adjectiveBase",
    "comparative",
    "superlative"
  ]
  .forEach(
    function(id) {

      document
        .getElementById(id)
        .value = "";

    }
  );

}


function clearForm() {

  editingIndex =
    null;


  document
    .getElementById(
      "japanese"
    )
    .value = "";


  document
    .getElementById(
      "partOfSpeech"
    )
    .value = "noun";


  clearInputFields();

  changePartOfSpeech();


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
      "＋ 新しい単語を追加";


  document
    .getElementById(
      "saveButton"
    )
    .textContent =
      "＋ この単語を登録する";


  document
    .getElementById(
      "cancelButton"
    )
    .style.display =
      "none";

}


/* ==================================================
   安全表示
================================================== */

function escapeHTML(
  text
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;

}


/* ==================================================
   初期表示
================================================== */

changePartOfSpeech();

showWords();

</script>
