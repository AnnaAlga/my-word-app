<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>MY WORDS 管理</title>


<style>

/* =========================================================
   BASIC
========================================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px;

  background: #f4f8fc;
  color: #243149;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}

button {
  cursor: pointer;
}

.app {
  max-width: 1400px;
  margin: auto;
}


/* =========================================================
   HEADER
========================================================= */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 20px;

  margin-bottom: 18px;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 1px;
}

.logo span {
  margin-left: 10px;

  color: #76839a;

  font-size: 19px;
  font-weight: 700;
}

.main-nav {
  display: flex;
  gap: 10px;
}

.main-nav a {
  min-width: 120px;

  padding: 13px 18px;

  text-decoration: none;
  text-align: center;

  color: #243149;
  background: #eaf1fa;

  border-radius: 14px;

  font-weight: 800;
}

.main-nav a.active {
  background: #3986e8;
  color: white;
}


/* =========================================================
   COMMON
========================================================= */

.card {
  background: white;

  border-radius: 22px;

  box-shadow:
    0 5px 22px
    rgba(45,60,90,.08);
}

.admin-layout {
  display: grid;

  grid-template-columns:
    minmax(360px, 42%)
    minmax(0, 58%);

  gap: 18px;

  align-items: start;
}

.section-title {
  margin-bottom: 8px;

  font-size: 25px;
  font-weight: 900;
}

.section-subtitle {
  margin-bottom: 22px;

  color: #7a8799;

  font-size: 14px;
  line-height: 1.6;
}


/* =========================================================
   LEFT FORM
========================================================= */

.form-card {
  padding: 26px;
}

.form-label {
  display: block;

  margin:
    16px
    0
    7px;

  font-size: 15px;
  font-weight: 900;
}

input,
select,
textarea {
  width: 100%;

  padding: 13px 14px;

  border:
    1px solid
    #ccd5e2;

  border-radius: 12px;

  background: white;

  color: #243149;

  font-family: inherit;
  font-size: 17px;

  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #3986e8;

  box-shadow:
    0 0 0 3px
    rgba(57,134,232,.12);
}

.hint {
  margin-top: 6px;

  color: #8490a2;

  font-size: 12px;
  line-height: 1.5;
}


/* =========================================================
   WORD FORM BOX
========================================================= */

.forms-box {
  margin-top: 20px;

  padding: 18px;

  border-radius: 18px;
}

.forms-box.normal {
  background: #edf6ff;
}

.forms-box.verb {
  background: #fff0f3;
}

.forms-box.adjective {
  background: #eff9f2;
}

.forms-title {
  margin-bottom: 12px;

  font-size: 18px;
  font-weight: 900;
}

.form-grid {
  display: grid;

  grid-template-columns:
    1fr
    1fr;

  gap: 12px;
}

.form-field label {
  display: block;

  margin-bottom: 6px;

  font-size: 13px;
  font-weight: 900;
}

.optional {
  color: #8b95a5;

  font-size: 11px;
  font-weight: 600;
}


/* =========================================================
   BUTTONS
========================================================= */

.primary-button {
  width: 100%;

  margin-top: 20px;

  padding: 16px;

  border: 0;

  border-radius: 15px;

  background: #3986e8;
  color: white;

  font-size: 18px;
  font-weight: 900;
}

.cancel-button {
  display: none;

  width: 100%;

  margin-top: 9px;

  padding: 13px;

  border: 0;

  border-radius: 14px;

  background: #e9eef5;
  color: #40506b;

  font-size: 16px;
  font-weight: 800;
}


/* =========================================================
   RIGHT LIST
========================================================= */

.list-card {
  padding: 26px;
}

.toolbar {
  display: grid;

  grid-template-columns:
    minmax(0,1fr)
    auto;

  gap: 10px;

  margin-bottom: 12px;
}

.backup-button {
  padding: 12px 15px;

  border: 0;
  border-radius: 12px;

  background: #edf3fb;
  color: #315983;

  font-size: 14px;
  font-weight: 900;
}

.filters {
  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-bottom: 16px;
}

.filter-button {
  padding: 9px 13px;

  border: 0;

  border-radius: 11px;

  background: #edf1f6;

  color: #536177;

  font-weight: 800;
}

.filter-button.active {
  background: #3986e8;
  color: white;
}

.count {
  margin-bottom: 10px;

  color: #788598;

  font-size: 13px;
}


/* =========================================================
   WORD TABLE
========================================================= */

.table-wrap {
  overflow-x: auto;
}

.word-table {
  width: 100%;

  border-collapse: collapse;
}

.word-table th {
  padding: 12px;

  background: #f2f5f9;

  text-align: left;

  color: #647186;

  font-size: 13px;
}

.word-table td {
  padding: 13px 12px;

  border-bottom:
    1px solid
    #e7ebf1;

  vertical-align: middle;
}

.word-english {
  font-size: 18px;
  font-weight: 900;
}

.word-forms {
  margin-top: 4px;

  color: #768297;

  font-size: 12px;
  line-height: 1.6;
}

.badge {
  display: inline-block;

  padding: 6px 10px;

  border-radius: 10px;

  font-size: 12px;
  font-weight: 900;

  white-space: nowrap;
}

.badge-verb {
  background: #ffe1e7;
  color: #c8425d;
}

.badge-noun {
  background: #e3f1ff;
  color: #2474b7;
}

.badge-adjective {
  background: #dff5e5;
  color: #258048;
}

.badge-other {
  background: #eeeef2;
  color: #687385;
}

.actions {
  display: flex;

  gap: 7px;
}

.edit-button,
.delete-button {
  padding: 8px 10px;

  border: 0;

  border-radius: 10px;

  font-weight: 800;
}

.edit-button {
  background: #e8f1ff;
  color: #326ba8;
}

.delete-button {
  background: #ffe8ec;
  color: #b13a55;
}

.empty {
  padding: 45px 20px;

  text-align: center;

  color: #8792a2;
}


/* =========================================================
   BACKUP CARD
========================================================= */

.backup-card {
  grid-column: 1 / -1;

  padding: 24px;

  margin-top: 2px;
}

.backup-header {
  display: flex;

  justify-content: space-between;
  align-items: center;

  gap: 18px;
}

.backup-title {
  font-size: 22px;
  font-weight: 900;
}

.backup-description {
  margin-top: 5px;

  color: #7a8799;

  font-size: 14px;
}

.backup-actions {
  display: flex;

  gap: 10px;
}

.backup-action {
  padding: 13px 18px;

  border: 0;

  border-radius: 13px;

  font-size: 15px;
  font-weight: 900;
}

.download-backup {
  background: #3986e8;
  color: white;
}

.restore-backup {
  background: #fff1cf;
  color: #725309;
}

.backup-info {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-top: 18px;
}

.backup-stat {
  padding: 13px;

  border-radius: 13px;

  background: #f4f7fb;
}

.backup-stat-label {
  color: #79869a;

  font-size: 12px;
  font-weight: 700;
}

.backup-stat-value {
  margin-top: 4px;

  font-size: 20px;
  font-weight: 900;
}


/* =========================================================
   TOAST
========================================================= */

.toast {
  position: fixed;

  left: 50%;
  bottom: 25px;

  z-index: 9999;

  transform:
    translateX(-50%)
    translateY(20px);

  opacity: 0;

  pointer-events: none;

  padding: 13px 20px;

  border-radius: 13px;

  background: #26364d;
  color: white;

  font-weight: 800;

  transition:
    .25s;
}

.toast.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (
  max-width: 1000px
) {

  .admin-layout {
    grid-template-columns:
      1fr;
  }

  .backup-card {
    grid-column: auto;
  }

}

@media (
  max-width: 700px
) {

  body {
    padding: 13px;
  }

  .header {
    display: block;
  }

  .main-nav {
    margin-top: 12px;
  }

  .main-nav a {
    min-width: 0;

    flex: 1;

    padding: 10px 6px;
  }

  .form-grid {
    grid-template-columns:
      1fr;
  }

  .toolbar {
    grid-template-columns:
      1fr;
  }

  .backup-header {
    display: block;
  }

  .backup-actions {
    margin-top: 15px;

    display: grid;

    grid-template-columns:
      1fr;
  }

  .backup-info {
    grid-template-columns:
      1fr;
  }

}

</style>

</head>


<body>


<div class="app">


<!-- ======================================================
     HEADER
====================================================== -->

<header class="header">

  <div class="logo">

    MY WORDS

    <span>
      単語管理
    </span>

  </div>


<nav class="main-nav">

  <a href="index.html">
    📖 学習
  </a>

  <a href="test.html">
    ✏️ テスト
  </a>

  <a href="admin.html">
    ⚙️ 管理
  </a>

  <a href="guide.html">
    ❓ 使い方
  </a>

</nav>

</header>



<div class="admin-layout">


<!-- ======================================================
     LEFT FORM
====================================================== -->

<section class="card form-card">


  <div
    id="formTitle"
    class="section-title">

    ＋ 新しい単語を追加

  </div>


  <div class="section-subtitle">

    日本語・品詞・英単語を登録します。
    動詞や形容詞は変化形も追加できます。

  </div>



  <label
    class="form-label"
    for="japanese">

    日本語の意味

  </label>


  <input
    id="japanese"
    type="text"
    lang="ja"
    autocomplete="off"
    placeholder="例：行く">



  <label
    class="form-label"
    for="partOfSpeech">

    品詞

  </label>


  <select
    id="partOfSpeech"
    onchange="changePartOfSpeech()">


    <option value="noun">
      名詞
    </option>


    <option value="verb">
      動詞
    </option>


    <option value="adjective">
      形容詞
    </option>


    <option value="other">
      その他・未分類
    </option>


  </select>



  <!-- NORMAL -->

  <div
    id="normalForms"
    class="forms-box normal">


    <div class="forms-title">

      英単語

    </div>


    <label class="form-label">

      基本の形

    </label>


    <input
      id="normalBase"
      type="text"
      lang="en"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="例：apple">


    <div class="hint">

      全角英字は登録時に半角・小文字へ整えます。

    </div>


  </div>



  <!-- VERB -->

  <div
    id="verbForms"
    class="forms-box verb"
    style="display:none;">


    <div class="forms-title">

      動詞の変化

    </div>


    <div class="form-grid">


      <div class="form-field">

        <label>
          原形
        </label>

        <input
          id="verbBase"
          placeholder="go">

      </div>


      <div class="form-field">

        <label>
          過去形
          <span class="optional">
            任意
          </span>
        </label>

        <input
          id="verbPast"
          placeholder="went">

      </div>


      <div class="form-field">

        <label>
          過去分詞
          <span class="optional">
            任意
          </span>
        </label>

        <input
          id="verbPastParticiple"
          placeholder="gone">

      </div>


      <div class="form-field">

        <label>
          ing形
          <span class="optional">
            任意
          </span>
        </label>

        <input
          id="verbIng"
          placeholder="going">

      </div>


      <div class="form-field">

        <label>
          三人称単数現在
          <span class="optional">
            任意
          </span>
        </label>

        <input
          id="verbThirdPerson"
          placeholder="goes">

      </div>


    </div>


  </div>



  <!-- ADJECTIVE -->

  <div
    id="adjectiveForms"
    class="forms-box adjective"
    style="display:none;">


    <div class="forms-title">

      形容詞の変化

    </div>


    <div class="form-grid">


      <div class="form-field">

        <label>
          原級
        </label>

        <input
          id="adjectiveBase"
          placeholder="beautiful">

      </div>


      <div class="form-field">

        <label>
          比較級
          <span class="optional">
            任意
          </span>
        </label>

        <input
          id="comparative"
          placeholder="more beautiful">

      </div>


      <div class="form-field">

        <label>
          最上級
          <span class="optional">
            任意
          </span>
        </label>

        <input
          id="superlative"
          placeholder="most beautiful">

      </div>


    </div>


  </div>



  <button
    id="saveButton"
    class="primary-button"
    onclick="saveWord()">

    ＋ この単語を登録する

  </button>


  <button
    id="cancelButton"
    class="cancel-button"
    onclick="cancelEdit()">

    編集をキャンセル

  </button>


</section>



<!-- ======================================================
     RIGHT LIST
====================================================== -->

<section class="card list-card">


  <div class="section-title">

    登録済みの単語

  </div>


  <div class="section-subtitle">

    登録した単語を検索・編集・削除できます。

  </div>



  <div class="toolbar">


    <input
      id="search"
      type="text"
      placeholder="日本語または英単語で検索"
      oninput="showWords()">


    <button
      class="backup-button"
      onclick="downloadBackup()">

      ↓ バックアップ

    </button>


  </div>



  <div class="filters">


    <button
      class="filter-button active"
      onclick="setFilter('all', this)">

      すべて

    </button>


    <button
      class="filter-button"
      onclick="setFilter('noun', this)">

      名詞

    </button>


    <button
      class="filter-button"
      onclick="setFilter('verb', this)">

      動詞

    </button>


    <button
      class="filter-button"
      onclick="setFilter('adjective', this)">

      形容詞

    </button>


    <button
      class="filter-button"
      onclick="setFilter('other', this)">

      その他

    </button>


  </div>



  <div
    id="count"
    class="count">
  </div>



  <div
    id="wordList"
    class="table-wrap">
  </div>


</section>



<!-- ======================================================
     BACKUP
====================================================== -->

<section class="card backup-card">


  <div class="backup-header">


    <div>


      <div class="backup-title">

        💾 データのバックアップ

      </div>


      <div class="backup-description">

        単語・苦手単語・自分メモをまとめて保存できます。

      </div>


    </div>



    <div class="backup-actions">


      <button
        class="backup-action download-backup"
        onclick="downloadBackup()">

        ↓ バックアップを保存

      </button>


      <button
        class="backup-action restore-backup"
        onclick="openBackupFile()">

        ↑ バックアップを読み込む

      </button>


    </div>


  </div>



  <div class="backup-info">


    <div class="backup-stat">

      <div class="backup-stat-label">

        登録単語

      </div>

      <div
        id="backupWordCount"
        class="backup-stat-value">

        0

      </div>

    </div>



    <div class="backup-stat">

      <div class="backup-stat-label">

        苦手単語

      </div>

      <div
        id="backupWeakCount"
        class="backup-stat-value">

        0

      </div>

    </div>



    <div class="backup-stat">

      <div class="backup-stat-label">

        メモ

      </div>

      <div
        id="backupMemoCount"
        class="backup-stat-value">

        0

      </div>

    </div>


  </div>


  <input
    id="backupFileInput"
    type="file"
    accept=".json,application/json"
    style="display:none;"
    onchange="restoreBackup(event)">


</section>


</div>


</div>


<div
  id="toast"
  class="toast">
</div>



<script>

/* =========================================================
   DATA
========================================================= */

let words =
  JSON.parse(
    localStorage.getItem(
      "words"
    )
  ) || [];


let weakWords =
  JSON.parse(
    localStorage.getItem(
      "weakWords"
    )
  ) || [];


let memos =
  JSON.parse(
    localStorage.getItem(
      "wordMemos"
    )
  ) || {};



/* =========================================================
   OLD DATA MIGRATION
========================================================= */

let dataChanged =
  false;


words =
  words.map(
    function(word) {


      if (
        !word.partOfSpeech
      ) {

        word.partOfSpeech =
          "other";

        dataChanged =
          true;

      }


      if (
        !word.forms
      ) {

        word.forms = {

          base:
            word.english
            || ""

        };

        dataChanged =
          true;

      }


      return word;

    }
  );


if (
  dataChanged
) {

  saveWords();

}



/* =========================================================
   STATE
========================================================= */

let editingIndex =
  null;


let currentFilter =
  "all";



/* =========================================================
   SAVE
========================================================= */

function saveWords() {

  localStorage
    .setItem(

      "words",

      JSON.stringify(
        words
      )

    );

}



/* =========================================================
   NORMALIZE ENGLISH
========================================================= */

function normalizeEnglish(
  text
) {

  return (
    text
    ||
    ""
  )

    .replace(
      /[Ａ-Ｚａ-ｚ０-９]/g,

      function(character) {

        return String
          .fromCharCode(

            character
              .charCodeAt(0)
            -
            0xFEE0

          );

      }
    )

    .replace(
      /　/g,
      " "
    )

    .trim()

    .toLowerCase();

}



/* =========================================================
   PART OF SPEECH
========================================================= */

function changePartOfSpeech() {

  const part =
    document
      .getElementById(
        "partOfSpeech"
      )
      .value;


  document
    .getElementById(
      "normalForms"
    )
    .style.display =
      (
        part === "noun"
        ||
        part === "other"
      )
      ?
      "block"
      :
      "none";


  document
    .getElementById(
      "verbForms"
    )
    .style.display =
      part === "verb"
      ?
      "block"
      :
      "none";


  document
    .getElementById(
      "adjectiveForms"
    )
    .style.display =
      part === "adjective"
      ?
      "block"
      :
      "none";

}



/* =========================================================
   SAVE WORD
========================================================= */

function saveWord() {

  const japanese =
    document
      .getElementById(
        "japanese"
      )
      .value
      .trim();


  const part =
    document
      .getElementById(
        "partOfSpeech"
      )
      .value;


  if (
    !japanese
  ) {

    alert(
      "日本語を入力してください。"
    );

    return;

  }


  let english =
    "";


  let forms =
    {};


  /* VERB */

  if (
    part ===
    "verb"
  ) {

    const base =
      normalizeEnglish(

        document
          .getElementById(
            "verbBase"
          )
          .value

      );


    if (
      !base
    ) {

      alert(
        "動詞の原形を入力してください。"
      );

      return;

    }


    forms = {

      base:
        base,

      past:
        normalizeEnglish(
          document
            .getElementById(
              "verbPast"
            )
            .value
        ),

      pastParticiple:
        normalizeEnglish(
          document
            .getElementById(
              "verbPastParticiple"
            )
            .value
        ),

      ing:
        normalizeEnglish(
          document
            .getElementById(
              "verbIng"
            )
            .value
        ),

      thirdPerson:
        normalizeEnglish(
          document
            .getElementById(
              "verbThirdPerson"
            )
            .value
        )

    };


    english =
      base;

  }


  /* ADJECTIVE */

  else if (
    part ===
    "adjective"
  ) {

    const base =
      normalizeEnglish(

        document
          .getElementById(
            "adjectiveBase"
          )
          .value

      );


    if (
      !base
    ) {

      alert(
        "形容詞の原級を入力してください。"
      );

      return;

    }


    forms = {

      base:
        base,

      comparative:
        normalizeEnglish(
          document
            .getElementById(
              "comparative"
            )
            .value
        ),

      superlative:
        normalizeEnglish(
          document
            .getElementById(
              "superlative"
            )
            .value
        )

    };


    english =
      base;

  }


  /* NORMAL */

  else {

    const base =
      normalizeEnglish(

        document
          .getElementById(
            "normalBase"
          )
          .value

      );


    if (
      !base
    ) {

      alert(
        "英単語を入力してください。"
      );

      return;

    }


    forms = {

      base:
        base

    };


    english =
      base;

  }



  const newWord = {

    english:
      english,

    japanese:
      japanese,

    partOfSpeech:
      part,

    forms:
      forms

  };



  if (
    editingIndex ===
    null
  ) {

    words.push(
      newWord
    );

  }


  else {

    const oldEnglish =
      words[
        editingIndex
      ]
      .english;


    words[
      editingIndex
    ] =
      newWord;


    /*
      英単語自体を変更した場合、
      苦手・メモも新しいキーへ移動
    */

    if (
      oldEnglish
      !==
      english
    ) {

      if (
        weakWords
          .includes(
            oldEnglish
          )
      ) {

        weakWords =
          weakWords
            .filter(
              function(item) {

                return (
                  item !==
                  oldEnglish
                );

              }
            );


        if (
          !weakWords
            .includes(
              english
            )
        ) {

          weakWords.push(
            english
          );

        }


        localStorage
          .setItem(

            "weakWords",

            JSON.stringify(
              weakWords
            )

          );

      }


      if (
        Object
          .prototype
          .hasOwnProperty
          .call(
            memos,
            oldEnglish
          )
      ) {

        memos[
          english
        ] =
          memos[
            oldEnglish
          ];


        delete memos[
          oldEnglish
        ];


        localStorage
          .setItem(

            "wordMemos",

            JSON.stringify(
              memos
            )

          );

      }

    }

  }


  saveWords();


  clearForm();


  showWords();


  updateBackupStats();


  showToast(
    editingIndex === null
      ?
      "単語を登録しました"
      :
      "変更を保存しました"
  );

}



/* =========================================================
   LIST
========================================================= */

function showWords() {

  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  let filtered =
    words.map(
      function(word,index) {

        return {

          word:
            word,

          originalIndex:
            index

        };

      }
    );


  /* FILTER */

  if (
    currentFilter !==
    "all"
  ) {

    filtered =
      filtered
        .filter(
          function(item) {

            return (
              item.word
                .partOfSpeech
              ===
              currentFilter
            );

          }
        );

  }


  /* SEARCH */

  if (
    search
  ) {

    filtered =
      filtered
        .filter(
          function(item) {

            const word =
              item.word;


            const formsText =
              Object
                .values(
                  word.forms
                  ||
                  {}
                )
                .join(" ")
                .toLowerCase();


            return (

              (
                word.japanese
                ||
                ""
              )
              .toLowerCase()
              .includes(
                search
              )

              ||

              (
                word.english
                ||
                ""
              )
              .toLowerCase()
              .includes(
                search
              )

              ||

              formsText
                .includes(
                  search
                )

            );

          }
        );

  }


  document
    .getElementById(
      "count"
    )
    .textContent =
      "表示 "
      +
      filtered.length
      +
      " 件 / 全 "
      +
      words.length
      +
      " 件";


  const list =
    document
      .getElementById(
        "wordList"
      );


  if (
    filtered.length ===
    0
  ) {

    list.innerHTML = `

      <div class="empty">

        該当する単語がありません。

      </div>

    `;

    return;

  }


  let html = `

    <table class="word-table">

      <thead>

        <tr>

          <th>
            日本語
          </th>

          <th>
            英単語
          </th>

          <th>
            品詞
          </th>

          <th>
            操作
          </th>

        </tr>

      </thead>

      <tbody>

  `;


  filtered.forEach(
    function(item) {

      const word =
        item.word;


      html += `

        <tr>

          <td>

            ${escapeHTML(
              word.japanese
            )}

          </td>


          <td>

            <div class="word-english">

              ${escapeHTML(
                word.english
              )}

            </div>

            ${getFormsDisplay(
              word
            )}

          </td>


          <td>

            ${getBadge(
              word.partOfSpeech
            )}

          </td>


          <td>

            <div class="actions">


              <button
                class="edit-button"
                onclick="editWord(${item.originalIndex})">

                編集

              </button>


              <button
                class="delete-button"
                onclick="deleteWord(${item.originalIndex})">

                削除

              </button>


            </div>

          </td>

        </tr>

      `;

    }
  );


  html += `

      </tbody>

    </table>

  `;


  list.innerHTML =
    html;

}



/* =========================================================
   FORMS DISPLAY
========================================================= */

function getFormsDisplay(
  word
) {

  const f =
    word.forms
    ||
    {};


  const parts =
    [];


  if (
    word.partOfSpeech
    ===
    "verb"
  ) {

    if (
      f.past
    ) {

      parts.push(
        "過去 "
        +
        escapeHTML(
          f.past
        )
      );

    }


    if (
      f.pastParticiple
    ) {

      parts.push(
        "過去分詞 "
        +
        escapeHTML(
          f.pastParticiple
        )
      );

    }


    if (
      f.ing
    ) {

      parts.push(
        "ing "
        +
        escapeHTML(
          f.ing
        )
      );

    }


    if (
      f.thirdPerson
    ) {

      parts.push(
        "三単現 "
        +
        escapeHTML(
          f.thirdPerson
        )
      );

    }

  }


  else if (
    word.partOfSpeech
    ===
    "adjective"
  ) {

    if (
      f.comparative
    ) {

      parts.push(
        "比較級 "
        +
        escapeHTML(
          f.comparative
        )
      );

    }


    if (
      f.superlative
    ) {

      parts.push(
        "最上級 "
        +
        escapeHTML(
          f.superlative
        )
      );

    }

  }


  if (
    parts.length ===
    0
  ) {

    return "";

  }


  return `

    <div class="word-forms">

      ${parts.join("　")}

    </div>

  `;

}



/* =========================================================
   FILTER
========================================================= */

function setFilter(
  filter,
  button
) {

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".filter-button"
    )
    .forEach(
      function(btn) {

        btn.classList
          .remove(
            "active"
          );

      }
    );


  button
    .classList
    .add(
      "active"
    );


  showWords();

}



/* =========================================================
   EDIT
========================================================= */

function editWord(
  index
) {

  editingIndex =
    index;


  const word =
    words[
      index
    ];


  document
    .getElementById(
      "japanese"
    )
    .value =
      word.japanese
      ||
      "";


  document
    .getElementById(
      "partOfSpeech"
    )
    .value =
      word.partOfSpeech
      ||
      "other";


  clearInputFields();


  changePartOfSpeech();


  const f =
    word.forms
    ||
    {};


  if (
    word.partOfSpeech
    ===
    "verb"
  ) {

    document
      .getElementById(
        "verbBase"
      )
      .value =
        f.base
        ||
        word.english
        ||
        "";


    document
      .getElementById(
        "verbPast"
      )
      .value =
        f.past
        ||
        "";


    document
      .getElementById(
        "verbPastParticiple"
      )
      .value =
        f.pastParticiple
        ||
        "";


    document
      .getElementById(
        "verbIng"
      )
      .value =
        f.ing
        ||
        "";


    document
      .getElementById(
        "verbThirdPerson"
      )
      .value =
        f.thirdPerson
        ||
        "";

  }


  else if (
    word.partOfSpeech
    ===
    "adjective"
  ) {

    document
      .getElementById(
        "adjectiveBase"
      )
      .value =
        f.base
        ||
        word.english
        ||
        "";


    document
      .getElementById(
        "comparative"
      )
      .value =
        f.comparative
        ||
        "";


    document
      .getElementById(
        "superlative"
      )
      .value =
        f.superlative
        ||
        "";

  }


  else {

    document
      .getElementById(
        "normalBase"
      )
      .value =
        f.base
        ||
        word.english
        ||
        "";

  }


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
      "✎ 単語を編集";


  document
    .getElementById(
      "saveButton"
    )
    .textContent =
      "変更を保存";


  document
    .getElementById(
      "cancelButton"
    )
    .style.display =
      "block";


  window.scrollTo({

    top:
      0,

    behavior:
      "smooth"

  });

}



/* =========================================================
   DELETE
========================================================= */

function deleteWord(
  index
) {

  const word =
    words[
      index
    ];


  if (
    !confirm(
      "「"
      +
      word.english
      +
      "」を削除しますか？"
    )
  ) {

    return;

  }


  words.splice(
    index,
    1
  );


  weakWords =
    weakWords
      .filter(
        function(item) {

          return (
            item !==
            word.english
          );

        }
      );


  delete memos[
    word.english
  ];


  saveWords();


  localStorage
    .setItem(

      "weakWords",

      JSON.stringify(
        weakWords
      )

    );


  localStorage
    .setItem(

      "wordMemos",

      JSON.stringify(
        memos
      )

    );


  clearForm();


  showWords();


  updateBackupStats();


  showToast(
    "単語を削除しました"
  );

}



/* =========================================================
   CLEAR
========================================================= */

function clearInputFields() {

  [

    "normalBase",

    "verbBase",

    "verbPast",

    "verbPastParticiple",

    "verbIng",

    "verbThirdPerson",

    "adjectiveBase",

    "comparative",

    "superlative"

  ]
  .forEach(
    function(id) {

      document
        .getElementById(
          id
        )
        .value =
          "";

    }
  );

}



function clearForm() {

  editingIndex =
    null;


  document
    .getElementById(
      "japanese"
    )
    .value =
      "";


  document
    .getElementById(
      "partOfSpeech"
    )
    .value =
      "noun";


  clearInputFields();


  changePartOfSpeech();


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
      "＋ 新しい単語を追加";


  document
    .getElementById(
      "saveButton"
    )
    .textContent =
      "＋ この単語を登録する";


  document
    .getElementById(
      "cancelButton"
    )
    .style.display =
      "none";

}



function cancelEdit() {

  clearForm();

}



/* =========================================================
   BACKUP DOWNLOAD
========================================================= */

function downloadBackup() {

  /*
    今後データ項目を増やしても
    バックアップ形式を判別できるよう
    versionを持たせる
  */

  const backup = {

    app:
      "MY WORDS",

    version:
      1,

    exportedAt:
      new Date()
        .toISOString(),

    data: {

      words:
        words,

      weakWords:
        weakWords,

      wordMemos:
        memos

    }

  };


  const json =
    JSON.stringify(
      backup,
      null,
      2
    );


  const blob =
    new Blob(
      [
        json
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL
      .createObjectURL(
        blob
      );


  const link =
    document
      .createElement(
        "a"
      );


  const now =
    new Date();


  const year =
    now
      .getFullYear();


  const month =
    String(
      now.getMonth()
      +
      1
    )
    .padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    )
    .padStart(
      2,
      "0"
    );


  link.href =
    url;


  link.download =
    "my-words-backup-"
    +
    year
    +
    "-"
    +
    month
    +
    "-"
    +
    day
    +
    ".json";


  document
    .body
    .appendChild(
      link
    );


  link.click();


  link.remove();


  URL
    .revokeObjectURL(
      url
    );


  showToast(
    "バックアップを保存しました"
  );

}



/* =========================================================
   BACKUP RESTORE
========================================================= */

function openBackupFile() {

  const input =
    document
      .getElementById(
        "backupFileInput"
      );


  /*
    同じファイルを連続で
    選んでもchangeが発火するようにする
  */

  input.value =
    "";


  input.click();

}



function restoreBackup(
  event
) {

  const file =
    event
      .target
      .files[
        0
      ];


  if (
    !file
  ) {
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function() {

      try {

        const backup =
          JSON.parse(
            reader.result
          );


        /*
          バックアップ形式をチェック
        */

        if (
          !backup
          ||
          backup.app !==
          "MY WORDS"
          ||
          !backup.data
          ||
          !Array.isArray(
            backup.data.words
          )
        ) {

          alert(
            "MY WORDSのバックアップファイルではないようです。"
          );

          return;

        }


        const restoredWords =
          backup.data.words;


        const restoredWeakWords =
          Array.isArray(
            backup.data.weakWords
          )
          ?
          backup.data.weakWords
          :
          [];


        const restoredMemos =
          (
            backup.data.wordMemos
            &&
            typeof backup.data.wordMemos
            === "object"
          )
          ?
          backup.data.wordMemos
          :
          {};


        const message =

          "バックアップを読み込みます。\n\n"
          +
          "現在のデータは置き換えられます。\n\n"
          +
          "バックアップ内容\n"
          +
          "・単語："
          +
          restoredWords.length
          +
          "件\n"
          +
          "・苦手："
          +
          restoredWeakWords.length
          +
          "件\n"
          +
          "・メモ："
          +
          Object
            .keys(
              restoredMemos
            )
            .length
          +
          "件\n\n"
          +
          "読み込んでもよいですか？";


        if (
          !confirm(
            message
          )
        ) {

          return;

        }


        /*
          ここまで正常に確認できてから
          localStorageを書き換える
        */

        localStorage
          .setItem(

            "words",

            JSON.stringify(
              restoredWords
            )

          );


        localStorage
          .setItem(

            "weakWords",

            JSON.stringify(
              restoredWeakWords
            )

          );


        localStorage
          .setItem(

            "wordMemos",

            JSON.stringify(
              restoredMemos
            )

          );


        words =
          restoredWords;


        weakWords =
          restoredWeakWords;


        memos =
          restoredMemos;


        /*
          古い形式のバックアップにも対応
        */

        words =
          words.map(
            function(word) {

              if (
                !word.partOfSpeech
              ) {

                word.partOfSpeech =
                  "other";

              }


              if (
                !word.forms
              ) {

                word.forms = {

                  base:
                    word.english
                    ||
                    ""

                };

              }


              return word;

            }
          );


        saveWords();


        clearForm();


        showWords();


        updateBackupStats();


        showToast(
          "バックアップを読み込みました"
        );


        alert(
          "バックアップの読み込みが完了しました。"
        );

      }


      catch(error) {

        console.error(
          error
        );


        alert(
          "バックアップファイルを読み込めませんでした。\nJSONファイルが壊れていないか確認してください。"
        );

      }

    };


  reader.onerror =
    function() {

      alert(
        "ファイルの読み込みに失敗しました。"
      );

    };


  reader
    .readAsText(
      file
    );

}



/* =========================================================
   BACKUP STATS
========================================================= */

function updateBackupStats() {

  document
    .getElementById(
      "backupWordCount"
    )
    .textContent =
      words.length;


  document
    .getElementById(
      "backupWeakCount"
    )
    .textContent =
      weakWords.length;


  document
    .getElementById(
      "backupMemoCount"
    )
    .textContent =
      Object
        .keys(
          memos
        )
        .filter(
          function(key) {

            return (
              String(
                memos[key]
              )
              .trim()
              !==
              ""
            );

          }
        )
        .length;

}



/* =========================================================
   BADGE
========================================================= */

function getBadge(
  part
) {

  if (
    part ===
    "verb"
  ) {

    return `

      <span class="badge badge-verb">
        動詞
      </span>

    `;

  }


  if (
    part ===
    "noun"
  ) {

    return `

      <span class="badge badge-noun">
        名詞
      </span>

    `;

  }


  if (
    part ===
    "adjective"
  ) {

    return `

      <span class="badge badge-adjective">
        形容詞
      </span>

    `;

  }


  return `

    <span class="badge badge-other">
      その他
    </span>

  `;

}



/* =========================================================
   TOAST
========================================================= */

let toastTimer =
  null;


function showToast(
  message
) {

  const toast =
    document
      .getElementById(
        "toast"
      );


  toast.textContent =
    message;


  toast.classList
    .add(
      "show"
    );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function() {

        toast.classList
          .remove(
            "show"
          );

      },
      1800
    );

}



/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(
  text
) {

  const div =
    document
      .createElement(
        "div"
      );


  div.textContent =
    text
    ||
    "";


  return div.innerHTML;

}



/* =========================================================
   INIT
========================================================= */

changePartOfSpeech();


showWords();


updateBackupStats();

</script>
