<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY WORDS テスト</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px;
  background: #f4f8fc;
  color: #243149;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
a,
input,
textarea {
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 1400px;
  margin: auto;
}


/* ==============================
   HEADER
============================== */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 18px;
}

.logo {
  font-size: 34px;
  font-weight: 900;
}

.logo span {
  margin-left: 10px;
  font-size: 19px;
  color: #76839a;
}

.main-nav {
  display: flex;
  gap: 10px;
}

.main-nav a {
  min-width: 120px;
  padding: 13px 18px;
  text-decoration: none;
  text-align: center;
  color: #243149;
  background: #eaf1fa;
  border-radius: 14px;
  font-weight: 800;
}

.main-nav a.active {
  background: #3986e8;
  color: white;
}


/* ==============================
   CARD
============================== */

.card {
  background: white;
  border-radius: 22px;
  box-shadow: 0 5px 22px rgba(45,60,90,.08);
}


/* ==============================
   SETUP SCREEN
============================== */

.setup-card {
  max-width: 1000px;
  margin: 0 auto;
  padding: 30px;
}

.setup-title {
  font-size: 28px;
  font-weight: 900;
  margin-bottom: 8px;
}

.setup-subtitle {
  color: #778399;
  margin-bottom: 28px;
}

.setup-section {
  margin-bottom: 28px;
}

.setup-label {
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 12px;
}

.option-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.option-button {
  min-height: 70px;
  padding: 12px;
  border: 2px solid #e0e6ef;
  background: #f9fbfe;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 800;
  color: #31405a;
  cursor: pointer;
}

.option-button small {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  opacity: .7;
}

.option-button.active {
  background: #3986e8;
  color: white;
  border-color: #3986e8;
}

.count-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.start-button {
  width: 100%;
  padding: 18px;
  border: 0;
  border-radius: 16px;
  background: #3986e8;
  color: white;
  font-size: 20px;
  font-weight: 900;
  cursor: pointer;
}

.setup-note {
  margin-top: 14px;
  text-align: center;
  color: #7c8798;
}


/* ==============================
   TEST SCREEN
============================== */

#testScreen {
  display: none;
}

.status-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

.status-card {
  padding: 18px 20px;
  border-radius: 18px;
  background: white;
  box-shadow: 0 4px 18px rgba(45,60,90,.07);
}

.status-title {
  color: #738097;
  font-size: 14px;
  font-weight: 800;
}

.status-number {
  margin-top: 5px;
  font-size: 24px;
  font-weight: 900;
}

.progress-bar {
  height: 9px;
  border-radius: 99px;
  background: #e8edf4;
  margin-top: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: #43bf76;
  border-radius: 99px;
}


/* ==============================
   TEST LAYOUT
============================== */

.test-layout {
  display: grid;
  grid-template-columns: minmax(0, 65%) minmax(330px, 35%);
  gap: 18px;
  align-items: start;
}

.test-card {
  padding: 26px;
}

.info-card {
  padding: 24px;
}


/* ==============================
   QUESTION
============================== */

.question-type {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 12px;
  background: #eaf4ff;
  color: #286eb6;
  font-weight: 900;
  margin-bottom: 20px;
}

.question-box {
  min-height: 170px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.question-main {
  font-size: clamp(48px, 7vw, 84px);
  font-weight: 900;
  line-height: 1.1;
  word-break: break-word;
}

.speaker-button {
  width: 58px;
  height: 58px;
  border: 0;
  border-radius: 50%;
  background: #e2f0ff;
  font-size: 25px;
  cursor: pointer;
}

.answer-input {
  width: 100%;
  margin-top: 15px;
  padding: 17px;
  border: 2px solid #d8dee9;
  border-radius: 14px;
  font-size: 28px;
  text-align: center;
  outline: none;
}

.answer-input:focus {
  border-color: #3986e8;
}

.check-button {
  width: 100%;
  margin-top: 14px;
  padding: 16px;
  border: 0;
  border-radius: 15px;
  background: #3986e8;
  color: white;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
}


/* ==============================
   RESULT
============================== */

.result-box {
  display: none;
  margin-top: 16px;
  padding: 20px;
  border-radius: 16px;
}

.result-box.correct {
  display: block;
  background: #eaf9ef;
  color: #177241;
}

.result-box.wrong {
  display: block;
  background: #fff0f3;
  color: #a62945;
}

.result-main {
  font-size: 24px;
  font-weight: 900;
}

.result-detail {
  margin-top: 9px;
  font-size: 17px;
  line-height: 1.7;
}

.answer-sound {
  margin-left: 8px;
  border: 0;
  background: #e4f0ff;
  border-radius: 50%;
  width: 38px;
  height: 38px;
  cursor: pointer;
}


/* ==============================
   HANDWRITING
============================== */

.handwriting {
  display: none;
  margin-top: 20px;
  padding: 18px;
  border-radius: 18px;
  background: #fff7dc;
}

.handwriting.show {
  display: block;
}

.handwriting-title {
  font-size: 21px;
  font-weight: 900;
  margin-bottom: 8px;
}

.handwriting-sub {
  color: #7d6a27;
  margin-bottom: 14px;
}

.canvas-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.canvas-wrap {
  position: relative;
  background: white;
  border-radius: 14px;
  border: 2px solid #eadfac;
  overflow: hidden;
  min-height: 170px;
}

.canvas-number {
  position: absolute;
  top: 8px;
  left: 8px;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #62adf1;
  color: white;
  font-weight: 900;
  border-radius: 50%;
  z-index: 2;
}

.write-canvas {
  display: block;
  width: 100%;
  height: 170px;
  touch-action: none;
}

.handwriting-actions {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 12px;
  margin-top: 14px;
}

.clear-button,
.next-button {
  padding: 15px;
  border: 0;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 900;
  cursor: pointer;
}

.clear-button {
  background: #edf1f7;
  color: #41506a;
}

.next-button {
  background: #3986e8;
  color: white;
}


/* ==============================
   INFO PANEL
============================== */

.info-title {
  font-size: 23px;
  font-weight: 900;
  margin-bottom: 18px;
}

.info-word-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.info-word-main {
  display: flex;
  align-items: center;
  gap: 10px;
}

.info-word {
  font-size: 38px;
  font-weight: 900;
}

.small-speaker {
  width: 43px;
  height: 43px;
  border: 0;
  border-radius: 50%;
  background: #e2f0ff;
  font-size: 20px;
  cursor: pointer;
}

.badge {
  padding: 7px 12px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 900;
}

.badge-verb {
  background: #dff6e9;
  color: #23804b;
}

.badge-noun {
  background: #e2f1ff;
  color: #2677bb;
}

.badge-adjective {
  background: #fff0d9;
  color: #9e6b12;
}

.badge-other {
  background: #eeeef2;
  color: #697385;
}

.info-section {
  margin-top: 18px;
}

.info-label {
  font-size: 14px;
  font-weight: 900;
  color: #4b73a6;
  margin-bottom: 8px;
}

.meaning-box {
  background: #f2f5f8;
  border-radius: 12px;
  padding: 14px;
  font-size: 20px;
  font-weight: 800;
}

.forms-box {
  border: 1px solid #e1e6ed;
  border-radius: 14px;
  overflow: hidden;
}

.form-row {
  display: grid;
  grid-template-columns: 110px 1fr auto;
  border-bottom: 1px solid #e5e9ef;
}

.form-row:last-child {
  border-bottom: 0;
}

.form-name {
  padding: 11px;
  background: #eef9f2;
  font-weight: 800;
}

.form-value {
  padding: 11px;
}

.form-sound {
  display: flex;
  align-items: center;
  padding: 5px 7px;
}

.form-sound button {
  width: 33px;
  height: 33px;
  border: 0;
  border-radius: 50%;
  background: #e9f4ff;
}


/* ==============================
   MEMO
============================== */

.memo-box {
  margin-top: 20px;
  padding: 16px;
  border-radius: 16px;
  background: #eef6ff;
}

.memo-title {
  font-size: 17px;
  font-weight: 900;
  color: #37679e;
  margin-bottom: 9px;
}

.memo-box textarea {
  width: 100%;
  min-height: 130px;
  padding: 12px;
  border: 1px solid #cfdbe8;
  border-radius: 11px;
  font-family: inherit;
  font-size: 16px;
}

.memo-save {
  width: 100%;
  margin-top: 8px;
  padding: 11px;
  border: 0;
  border-radius: 11px;
  background: #4e94d8;
  color: white;
  font-weight: 900;
}


/* ==============================
   FINAL RESULT
============================== */

.final-result {
  max-width: 1000px;
  margin: auto;
}

.final-grid {
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: 18px;
}

.final-score {
  padding: 28px;
  text-align: center;
}

.big-score {
  font-size: 72px;
  font-weight: 900;
}

.big-rate {
  margin-top: 10px;
  font-size: 28px;
  font-weight: 900;
}

.wrong-list-card {
  padding: 26px;
}

.wrong-item {
  padding: 14px;
  margin-bottom: 10px;
  background: #fff3f5;
  border-radius: 13px;
}

.wrong-word {
  font-size: 19px;
  font-weight: 900;
}

.wrong-detail {
  margin-top: 6px;
  line-height: 1.7;
}

.final-actions {
  margin-top: 18px;
  display: grid;
  grid-template-columns: 1.3fr 1fr 1fr;
  gap: 12px;
}

.final-actions button {
  padding: 15px;
  border: 0;
  border-radius: 14px;
  font-weight: 900;
  font-size: 16px;
}

.retry-wrong {
  background: #ffd977;
}

.select-again {
  background: #3986e8;
  color: white;
}

.back-study {
  background: #e7ecf3;
}


/* ==============================
   RESPONSIVE
============================== */

@media (max-width: 1000px) {

  .option-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .test-layout {
    grid-template-columns: 1fr;
  }

  .canvas-grid {
    grid-template-columns: 1fr;
  }

  .final-grid {
    grid-template-columns: 1fr;
  }

}

@media (max-width: 700px) {

  body {
    padding: 13px;
  }

  .header {
    display: block;
  }

  .main-nav {
    margin-top: 12px;
  }

  .main-nav a {
    flex: 1;
    min-width: 0;
    padding: 10px 6px;
  }

  .option-grid,
  .count-grid,
  .status-grid,
  .handwriting-actions,
  .final-actions {
    grid-template-columns: 1fr;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="logo">
    MY WORDS
    <span>テストモード</span>
  </div>

  <nav class="main-nav">
    <a href="index.html">📖 学習</a>
    <a href="test.html" class="active">✏️ テスト</a>
    <a href="admin.html">⚙️ 管理</a>
  </nav>

</header>


<!-- =========================
     設定画面
========================= -->

<section id="setupScreen" class="card setup-card">

  <div class="setup-title">
    テストを選ぼう
  </div>

  <div class="setup-subtitle">
    テストの種類と問題数を選んでください。
  </div>


  <div class="setup-section">

    <div class="setup-label">
      テストの種類
    </div>

    <div class="option-grid">

      <button
        class="option-button test-type active"
        onclick="selectTestType('jaen', this)">
        日本語 → 英語
        <small>日本語を見て英語を入力</small>
      </button>

      <button
        class="option-button test-type"
        onclick="selectTestType('enja', this)">
        英語 → 日本語
        <small>英語を見て日本語を入力</small>
      </button>

      <button
        class="option-button test-type"
        onclick="selectTestType('verb', this)">
        動詞の変化
        <small>過去形・過去分詞など</small>
      </button>

      <button
        class="option-button test-type"
        onclick="selectTestType('adjective', this)">
        形容詞の変化
        <small>比較級・最上級</small>
      </button>

      <button
        class="option-button test-type"
        onclick="selectTestType('weak', this)">
        ★ 苦手だけ
        <small>苦手単語だけ出題</small>
      </button>

    </div>

  </div>


  <div class="setup-section">

    <div class="setup-label">
      問題数
    </div>

    <div class="count-grid">

      <button
        class="option-button count-button active"
        onclick="selectCount(5, this)">
        5問
      </button>

      <button
        class="option-button count-button"
        onclick="selectCount(10, this)">
        10問
      </button>

      <button
        class="option-button count-button"
        onclick="selectCount(20, this)">
        20問
      </button>

      <button
        class="option-button count-button"
        onclick="selectCount('all', this)">
        全部
      </button>

    </div>

  </div>


  <button
    class="start-button"
    onclick="startTest()">
    テストスタート！
  </button>

  <div
    id="setupNote"
    class="setup-note">
  </div>

</section>


<!-- =========================
     テスト画面
========================= -->

<section id="testScreen">

  <div class="status-grid">

    <div class="status-card">

      <div class="status-title">
        問題
      </div>

      <div
        id="questionProgress"
        class="status-number">
        1 / 10
      </div>

      <div class="progress-bar">
        <div
          id="progressFill"
          class="progress-fill">
        </div>
      </div>

    </div>


    <div class="status-card">

      <div class="status-title">
        正解
      </div>

      <div
        id="correctCount"
        class="status-number">
        0
      </div>

    </div>


    <div class="status-card">

      <div class="status-title">
        正答率
      </div>

      <div
        id="accuracy"
        class="status-number">
        0%
      </div>

    </div>

  </div>


  <div class="test-layout">

    <!-- 左 -->

    <section class="card test-card">

      <div
        id="questionType"
        class="question-type">
      </div>


      <div class="question-box">

        <div
          id="questionMain"
          class="question-main">
        </div>

        <button
          id="questionSpeaker"
          class="speaker-button"
          onclick="speakQuestion()">
          🔊
        </button>

      </div>


      <input
        id="answerInput"
        class="answer-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
        placeholder="答えを入力">


      <button
        id="checkButton"
        class="check-button"
        onclick="checkAnswer()">
        答え合わせ
      </button>


      <div
        id="resultBox"
        class="result-box">
      </div>


      <div
        id="handwriting"
        class="handwriting">

        <div class="handwriting-title">
          ✍ 3回書いて覚えよう
        </div>

        <div
          id="handwritingSub"
          class="handwriting-sub">
        </div>


        <div class="canvas-grid">

          <div class="canvas-wrap">
            <div class="canvas-number">1</div>
            <canvas
              id="canvas1"
              class="write-canvas">
            </canvas>
          </div>

          <div class="canvas-wrap">
            <div class="canvas-number">2</div>
            <canvas
              id="canvas2"
              class="write-canvas">
            </canvas>
          </div>

          <div class="canvas-wrap">
            <div class="canvas-number">3</div>
            <canvas
              id="canvas3"
              class="write-canvas">
            </canvas>
          </div>

        </div>


        <div class="handwriting-actions">

          <button
            class="clear-button"
            onclick="clearCanvases()">
            🗑 全部消す
          </button>

          <button
            class="next-button"
            onclick="nextQuestion()">
            3回書いた！ 次へ →
          </button>

        </div>

      </div>


      <button
        id="nextButton"
        class="next-button"
        style="display:none; width:100%; margin-top:16px;"
        onclick="nextQuestion()">
        次の問題 →
      </button>

    </section>


    <!-- 右 -->

    <aside class="card info-card">

      <div class="info-title">
        この単語の情報
      </div>

      <div id="infoContent"></div>

    </aside>

  </div>

</section>


<!-- =========================
     結果画面
========================= -->

<section
  id="finalScreen"
  class="final-result"
  style="display:none;">

  <div class="final-grid">

    <div class="card final-score">

      <div>
        テスト終了！
      </div>

      <div
        id="finalScore"
        class="big-score">
      </div>

      <div
        id="finalRate"
        class="big-rate">
      </div>

      <div
        id="finalMessage"
        style="margin-top:18px; font-size:22px; font-weight:900;">
      </div>

    </div>


    <div class="card wrong-list-card">

      <h2>
        📝 間違えた単語
      </h2>

      <div id="wrongList"></div>

    </div>

  </div>


  <div class="final-actions">

    <button
      id="retryWrongButton"
      class="retry-wrong"
      onclick="retryWrongOnly()">
      間違えた問題だけもう一度
    </button>

    <button
      class="select-again"
      onclick="location.reload()">
      テストを選び直す
    </button>

    <button
      class="back-study"
      onclick="location.href='index.html'">
      学習画面へ
    </button>

  </div>

</section>

</div>


<script>

/* =============================
   DATA
============================= */

let words =
  JSON.parse(
    localStorage.getItem("words")
  ) || [];

let weakWords =
  JSON.parse(
    localStorage.getItem("weakWords")
  ) || [];

let memos =
  JSON.parse(
    localStorage.getItem("wordMemos")
  ) || {};


words = words.map(function(word) {

  if (!word.forms) {
    word.forms = {
      base: word.english || ""
    };
  }

  if (!word.partOfSpeech) {
    word.partOfSpeech = "other";
  }

  return word;

});


let selectedType = "jaen";
let selectedCount = 5;

let testItems = [];
let current = 0;
let correctCount = 0;
let answeredCount = 0;
let answered = false;

let wrongAnswers = [];
let retryMode = false;


/* =============================
   SETTINGS
============================= */

function selectTestType(type, button) {

  selectedType = type;

  document
    .querySelectorAll(".test-type")
    .forEach(function(btn) {
      btn.classList.remove("active");
    });

  button.classList.add("active");

  updateSetupNote();

}


function selectCount(count, button) {

  selectedCount = count;

  document
    .querySelectorAll(".count-button")
    .forEach(function(btn) {
      btn.classList.remove("active");
    });

  button.classList.add("active");

}


function updateSetupNote() {

  let count = 0;

  if (selectedType === "weak") {

    count =
      words.filter(function(word) {
        return weakWords.includes(word.english);
      }).length;

    document
      .getElementById("setupNote")
      .textContent =
        "現在の苦手単語：" +
        count +
        "個";

  }

  else {

    document
      .getElementById("setupNote")
      .textContent =
        "現在の登録単語：" +
        words.length +
        "個";

  }

}


/* =============================
   BUILD QUESTIONS
============================= */

function buildItems(type) {

  const items = [];


  if (type === "jaen") {

    words.forEach(function(word) {

      items.push({
        word: word,
        label: "英単語を入力してください",
        question: word.japanese,
        answer: word.english,
        questionIsEnglish: false,
        answerIsEnglish: true
      });

    });

  }


  else if (type === "enja") {

    words.forEach(function(word) {

      items.push({
        word: word,
        label: "日本語の意味を入力してください",
        question: word.english,
        answer: word.japanese,
        questionIsEnglish: true,
        answerIsEnglish: false
      });

    });

  }


  else if (type === "weak") {

    words
      .filter(function(word) {
        return weakWords.includes(word.english);
      })
      .forEach(function(word) {

        items.push({
          word: word,
          label: "苦手単語をテスト",
          question: word.japanese,
          answer: word.english,
          questionIsEnglish: false,
          answerIsEnglish: true
        });

      });

  }


  else if (type === "verb") {

    words
      .filter(function(word) {
        return word.partOfSpeech === "verb";
      })
      .forEach(function(word) {

        const f = word.forms || {};
        const base = f.base || word.english;


        if (f.past) {

          items.push({
            word: word,
            label: "過去形にしてください",
            question: base,
            answer: f.past,
            questionIsEnglish: true,
            answerIsEnglish: true
          });

        }


        if (f.pastParticiple) {

          items.push({
            word: word,
            label: "過去分詞にしてください",
            question: base,
            answer: f.pastParticiple,
            questionIsEnglish: true,
            answerIsEnglish: true
          });

        }


        if (f.ing) {

          items.push({
            word: word,
            label: "ing形にしてください",
            question: base,
            answer: f.ing,
            questionIsEnglish: true,
            answerIsEnglish: true
          });

        }


        if (f.thirdPerson) {

          items.push({
            word: word,
            label: "三人称単数現在にしてください",
            question: base,
            answer: f.thirdPerson,
            questionIsEnglish: true,
            answerIsEnglish: true
          });

        }

      });

  }


  else if (type === "adjective") {

    words
      .filter(function(word) {
        return word.partOfSpeech === "adjective";
      })
      .forEach(function(word) {

        const f = word.forms || {};
        const base = f.base || word.english;


        if (f.comparative) {

          items.push({
            word: word,
            label: "比較級にしてください",
            question: base,
            answer: f.comparative,
            questionIsEnglish: true,
            answerIsEnglish: true
          });

        }


        if (f.superlative) {

          items.push({
            word: word,
            label: "最上級にしてください",
            question: base,
            answer: f.superlative,
            questionIsEnglish: true,
            answerIsEnglish: true
          });

        }

      });

  }


  return items;

}


/* =============================
   START
============================= */

function startTest() {

  let available =
    buildItems(selectedType);


  if (available.length === 0) {

    alert(
      "このテストで使える単語がありません。"
    );

    return;

  }


  available =
    shuffle(available);


  if (selectedCount === "all") {

    testItems =
      available;

  }

  else {

    testItems =
      available.slice(
        0,
        Math.min(
          selectedCount,
          available.length
        )
      );

  }


  retryMode = false;

  prepareTest();

}


/* =============================
   PREPARE
============================= */

function prepareTest() {

  current = 0;
  correctCount = 0;
  answeredCount = 0;
  answered = false;
  wrongAnswers = [];


  document
    .getElementById("setupScreen")
    .style.display = "none";

  document
    .getElementById("finalScreen")
    .style.display = "none";

  document
    .getElementById("testScreen")
    .style.display = "block";


  showQuestion();

}


/* =============================
   SHOW QUESTION
============================= */

function showQuestion() {

  answered = false;

  clearCanvases();

  document
    .getElementById("handwriting")
    .classList.remove("show");

  document
    .getElementById("nextButton")
    .style.display = "none";


  const item =
    testItems[current];


  document
    .getElementById("questionType")
    .textContent =
      item.label;


  document
    .getElementById("questionMain")
    .textContent =
      item.question;


  document
    .getElementById("questionSpeaker")
    .style.display =
      item.questionIsEnglish
        ? "block"
        : "none";


  const input =
    document.getElementById(
      "answerInput"
    );


  input.value = "";
  input.disabled = false;


  input.placeholder =
    item.answerIsEnglish
      ? "英語を入力"
      : "日本語を入力";


  document
    .getElementById("checkButton")
    .style.display = "block";


  const result =
    document.getElementById(
      "resultBox"
    );

  result.className =
    "result-box";

  result.innerHTML =
    "";


  renderInfo(
    item.word
  );


  updateStatus();


  setTimeout(function() {
    input.focus();
  }, 100);

}


/* =============================
   CHECK
============================= */

function checkAnswer() {

  if (answered) return;


  const item =
    testItems[current];


  let userAnswer =
    document
      .getElementById(
        "answerInput"
      )
      .value
      .trim();


  if (!userAnswer) {

    alert(
      "答えを入力してください"
    );

    return;

  }


  let correctAnswer =
    item.answer;


  if (item.answerIsEnglish) {

    userAnswer =
      normalizeEnglish(
        userAnswer
      );

    correctAnswer =
      normalizeEnglish(
        correctAnswer
      );

  }


  answered = true;
  answeredCount++;


  const result =
    document.getElementById(
      "resultBox"
    );


  if (
    userAnswer ===
    correctAnswer
  ) {

    correctCount++;

    result.className =
      "result-box correct";

    result.innerHTML = `

      <div class="result-main">
        🎉 正解！
      </div>

      ${
        item.answerIsEnglish
        ?
        `
        <div class="result-detail">
          ${escapeHTML(item.answer)}
          <button
            class="answer-sound"
            onclick='speakEnglish(${JSON.stringify(item.answer)})'>
            🔊
          </button>
        </div>
        `
        : ""
      }

    `;


    document
      .getElementById("nextButton")
      .style.display =
        "block";

  }

  else {

    addWeakWord(
      item.word.english
    );


    wrongAnswers.push({

      item: item,

      userAnswer:
        userAnswer,

      correctAnswer:
        item.answer

    });


    result.className =
      "result-box wrong";

    result.innerHTML = `

      <div class="result-main">
        ❌ ざんねん
      </div>

      <div class="result-detail">

        あなたの答え：
        <strong>
          ${escapeHTML(userAnswer)}
        </strong>

        <br>

        正解：
        <strong>
          ${escapeHTML(item.answer)}
        </strong>

        ${
          item.answerIsEnglish
          ?
          `
            <button
              class="answer-sound"
              onclick='speakEnglish(${JSON.stringify(item.answer)})'>
              🔊
            </button>
          `
          : ""
        }

        <br>

        ★ 苦手単語に追加しました

      </div>

    `;


    if (item.answerIsEnglish) {

      document
        .getElementById(
          "handwritingSub"
        )
        .textContent =
          "「" +
          item.answer +
          "」を3回書いてみましょう。";


      document
        .getElementById(
          "handwriting"
        )
        .classList.add(
          "show"
        );


      setTimeout(
        resizeCanvases,
        50
      );

    }

    else {

      document
        .getElementById(
          "nextButton"
        )
        .style.display =
          "block";

    }

  }


  document
    .getElementById(
      "answerInput"
    )
    .disabled =
      true;


  document
    .getElementById(
      "checkButton"
    )
    .style.display =
      "none";


  updateStatus();

}


/* =============================
   NEXT
============================= */

function nextQuestion() {

  current++;


  if (
    current >=
    testItems.length
  ) {

    showFinal();

    return;

  }


  showQuestion();

}


/* =============================
   STATUS
============================= */

function updateStatus() {

  document
    .getElementById(
      "questionProgress"
    )
    .textContent =
      (current + 1)
      + " / "
      + testItems.length;


  document
    .getElementById(
      "correctCount"
    )
    .textContent =
      correctCount;


  const rate =
    answeredCount === 0
      ? 0
      : Math.round(
          correctCount /
          answeredCount *
          100
        );


  document
    .getElementById(
      "accuracy"
    )
    .textContent =
      rate + "%";


  document
    .getElementById(
      "progressFill"
    )
    .style.width =
      (
        (current + 1) /
        testItems.length *
        100
      )
      + "%";

}


/* =============================
   FINAL
============================= */

function showFinal() {

  document
    .getElementById(
      "testScreen"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "finalScreen"
    )
    .style.display =
      "block";


  const rate =
    Math.round(
      correctCount /
      testItems.length *
      100
    );


  document
    .getElementById(
      "finalScore"
    )
    .textContent =
      correctCount
      + " / "
      + testItems.length;


  document
    .getElementById(
      "finalRate"
    )
    .textContent =
      "正答率 "
      + rate
      + "%";


  let message = "";


  if (rate === 100) {

    message =
      "🏆 パーフェクト！";

  }

  else if (rate >= 80) {

    message =
      "🎉 すごい！";

  }

  else if (rate >= 60) {

    message =
      "👍 いい感じ！";

  }

  else {

    message =
      "もう一度やってみよう！";

  }


  document
    .getElementById(
      "finalMessage"
    )
    .textContent =
      message;


  const list =
    document.getElementById(
      "wrongList"
    );


  if (
    wrongAnswers.length === 0
  ) {

    list.innerHTML = `
      <div style="
        padding:25px;
        background:#eefaf2;
        border-radius:14px;
        text-align:center;
        font-weight:900;
      ">
        🎉 間違えた問題はありません！
      </div>
    `;


    document
      .getElementById(
        "retryWrongButton"
      )
      .style.display =
        "none";

  }

  else {

    document
      .getElementById(
        "retryWrongButton"
      )
      .style.display =
        "block";


    let html = "";


    wrongAnswers.forEach(
      function(entry) {

        html += `

          <div class="wrong-item">

            <div class="wrong-word">
              ${escapeHTML(
                entry.item.question
              )}
            </div>

            <div class="wrong-detail">

              あなた：
              ${escapeHTML(
                entry.userAnswer
              )}

              <br>

              正解：
              <strong>
                ${escapeHTML(
                  entry.correctAnswer
                )}
              </strong>

            </div>

          </div>

        `;

      }
    );


    list.innerHTML =
      html;

  }

}


/* =============================
   RETRY WRONG
============================= */

function retryWrongOnly() {

  if (
    wrongAnswers.length === 0
  ) {
    return;
  }


  testItems =
    shuffle(
      wrongAnswers.map(
        function(entry) {
          return entry.item;
        }
      )
    );


  retryMode =
    true;


  prepareTest();

}


/* =============================
   WEAK
============================= */

function addWeakWord(
  english
) {

  if (
    !weakWords.includes(
      english
    )
  ) {

    weakWords.push(
      english
    );


    localStorage.setItem(
      "weakWords",
      JSON.stringify(
        weakWords
      )
    );

  }

}


/* =============================
   AUDIO
============================= */

function speakEnglish(
  text
) {

  if (
    !text
    ||
    !(
      "speechSynthesis"
      in window
    )
  ) {
    return;
  }


  speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.lang =
    "en-US";

  speech.rate =
    0.8;


  const voices =
    speechSynthesis
      .getVoices();


  const voice =
    voices.find(
      function(v) {

        return (
          v.lang
          &&
          v.lang
            .toLowerCase()
            .startsWith(
              "en-us"
            )
        );

      }
    )
    ||
    voices.find(
      function(v) {

        return (
          v.lang
          &&
          v.lang
            .toLowerCase()
            .startsWith(
              "en"
            )
        );

      }
    );


  if (voice) {
    speech.voice = voice;
  }


  speechSynthesis.speak(
    speech
  );

}


function speakQuestion() {

  if (
    testItems.length === 0
  ) {
    return;
  }


  const item =
    testItems[current];


  if (
    item.questionIsEnglish
  ) {

    speakEnglish(
      item.question
    );

  }

}


/* =============================
   INFO
============================= */

function renderInfo(
  word
) {

  const info =
    document.getElementById(
      "infoContent"
    );


  const f =
    word.forms || {
      base: word.english
    };


  const rows =
    [];


  if (
    word.partOfSpeech
    === "verb"
  ) {

    if (f.base) {
      rows.push(
        ["原形", f.base]
      );
    }

    if (f.past) {
      rows.push(
        ["過去形", f.past]
      );
    }

    if (f.pastParticiple) {
      rows.push(
        [
          "過去分詞",
          f.pastParticiple
        ]
      );
    }

    if (f.ing) {
      rows.push(
        ["ing形", f.ing]
      );
    }

    if (f.thirdPerson) {
      rows.push(
        [
          "三単現",
          f.thirdPerson
        ]
      );
    }

  }


  else if (
    word.partOfSpeech
    === "adjective"
  ) {

    if (f.base) {
      rows.push(
        ["原級", f.base]
      );
    }

    if (f.comparative) {
      rows.push(
        [
          "比較級",
          f.comparative
        ]
      );
    }

    if (f.superlative) {
      rows.push(
        [
          "最上級",
          f.superlative
        ]
      );
    }

  }


  else {

    rows.push(
      [
        "基本形",
        f.base ||
        word.english
      ]
    );

  }


  let formsHTML = `
    <div class="info-section">
      <div class="info-label">
        変化形
      </div>
      <div class="forms-box">
  `;


  rows.forEach(
    function(row) {

      formsHTML += `

        <div class="form-row">

          <div class="form-name">
            ${escapeHTML(
              row[0]
            )}
          </div>

          <div class="form-value">
            ${escapeHTML(
              row[1]
            )}
          </div>

          <div class="form-sound">

            <button
              onclick='speakEnglish(${JSON.stringify(row[1])})'>
              🔊
            </button>

          </div>

        </div>

      `;

    }
  );


  formsHTML += `
      </div>
    </div>
  `;


  const memo =
    memos[
      word.english
    ] || "";


  info.innerHTML = `

    <div class="info-word-row">

      <div class="info-word-main">

        <div class="info-word">
          ${escapeHTML(
            word.english
          )}
        </div>

        <button
          class="small-speaker"
          onclick='speakEnglish(${JSON.stringify(word.english)})'>
          🔊
        </button>

      </div>

      ${getBadge(
        word.partOfSpeech
      )}

    </div>


    <div class="info-section">

      <div class="info-label">
        日本語の意味
      </div>

      <div class="meaning-box">
        ${escapeHTML(
          word.japanese
        )}
      </div>

    </div>


    ${formsHTML}


    <div class="memo-box">

      <div class="memo-title">
        ✎ 自分メモ
      </div>

      <textarea
        id="memoInput"
        placeholder="間違えやすいポイントなどをメモできます。">${escapeHTML(memo)}</textarea>

      <button
        class="memo-save"
        onclick="saveMemo()">
        メモを保存
      </button>

    </div>

  `;

}


/* =============================
   MEMO
============================= */

function saveMemo() {

  if (
    testItems.length === 0
  ) {
    return;
  }


  const word =
    testItems[current]
      .word;


  memos[
    word.english
  ] =
    document
      .getElementById(
        "memoInput"
      )
      .value;


  localStorage.setItem(
    "wordMemos",
    JSON.stringify(
      memos
    )
  );

}


/* =============================
   BADGE
============================= */

function getBadge(
  part
) {

  if (part === "verb") {

    return `
      <span class="badge badge-verb">
        動詞
      </span>
    `;

  }


  if (part === "noun") {

    return `
      <span class="badge badge-noun">
        名詞
      </span>
    `;

  }


  if (
    part === "adjective"
  ) {

    return `
      <span class="badge badge-adjective">
        形容詞
      </span>
    `;

  }


  return `
    <span class="badge badge-other">
      その他
    </span>
  `;

}


/* =============================
   HANDWRITING
============================= */

const canvases = [
  document.getElementById(
    "canvas1"
  ),
  document.getElementById(
    "canvas2"
  ),
  document.getElementById(
    "canvas3"
  )
];


canvases.forEach(
  function(canvas) {

    setupCanvas(
      canvas
    );

  }
);


function setupCanvas(
  canvas
) {

  let drawing = false;


  function pointerPosition(
    event
  ) {

    const rect =
      canvas
        .getBoundingClientRect();


    return {

      x:
        event.clientX
        - rect.left,

      y:
        event.clientY
        - rect.top

    };

  }


  canvas.addEventListener(
    "pointerdown",
    function(event) {

      drawing = true;

      canvas.setPointerCapture(
        event.pointerId
      );


      const ctx =
        canvas.getContext(
          "2d"
        );


      const point =
        pointerPosition(
          event
        );


      ctx.beginPath();

      ctx.moveTo(
        point.x,
        point.y
      );

    }
  );


  canvas.addEventListener(
    "pointermove",
    function(event) {

      if (!drawing) {
        return;
      }


      const ctx =
        canvas.getContext(
          "2d"
        );


      const point =
        pointerPosition(
          event
        );


      ctx.lineWidth =
        4;

      ctx.lineCap =
        "round";

      ctx.lineJoin =
        "round";

      ctx.strokeStyle =
        "#555";


      ctx.lineTo(
        point.x,
        point.y
      );

      ctx.stroke();

    }
  );


  canvas.addEventListener(
    "pointerup",
    function() {

      drawing =
        false;

    }
  );


  canvas.addEventListener(
    "pointercancel",
    function() {

      drawing =
        false;

    }
  );

}


function resizeCanvases() {

  canvases.forEach(
    function(canvas) {

      const rect =
        canvas
          .getBoundingClientRect();


      if (
        rect.width === 0
        ||
        rect.height === 0
      ) {
        return;
      }


      const ratio =
        window.devicePixelRatio
        || 1;


      canvas.width =
        rect.width
        * ratio;

      canvas.height =
        rect.height
        * ratio;


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );

    }
  );

}


function clearCanvases() {

  canvases.forEach(
    function(canvas) {

      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

    }
  );

}


/* =============================
   UTILITIES
============================= */

function normalizeEnglish(
  text
) {

  return text
    .replace(
      /[Ａ-Ｚａ-ｚ０-９]/g,
      function(character) {

        return String
          .fromCharCode(
            character
              .charCodeAt(0)
            - 0xFEE0
          );

      }
    )
    .replace(
      /　/g,
      " "
    )
    .trim()
    .toLowerCase();

}


function shuffle(
  array
) {

  const copied =
    [...array];


  for (
    let i =
      copied.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random()
        *
        (i + 1)
      );


    [
      copied[i],
      copied[j]
    ]
    =
    [
      copied[j],
      copied[i]
    ];

  }


  return copied;

}


function escapeHTML(
  text
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;

}

   ENTER KEY
============================= */

document
  .getElementById(
    "answerInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
        &&
        !answered
      ) {

        checkAnswer();

      }

    }
  );


window.addEventListener(
  "resize",
  function() {

    resizeCanvases();

  }
);


updateSetupNote();
