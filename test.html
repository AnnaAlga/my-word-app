<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>MY WORDS テスト</title>


<style>

/* =========================================================
   BASIC
========================================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px;

  background: #f4f8fc;
  color: #243149;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
a,
input,
textarea,
canvas {
  -webkit-tap-highlight-color: transparent;
}

button {
  cursor: pointer;
}

.app {
  max-width: 1400px;
  margin: auto;
}


/* =========================================================
   HEADER
========================================================= */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 20px;

  margin-bottom: 18px;
}

.logo {
  font-size: 34px;
  font-weight: 900;
}

.logo span {
  margin-left: 10px;

  font-size: 19px;
  color: #76839a;
}

.main-nav {
  display: flex;
  gap: 10px;
}

.main-nav a {
  min-width: 120px;

  padding: 13px 18px;

  text-decoration: none;
  text-align: center;

  color: #243149;
  background: #eaf1fa;

  border-radius: 14px;

  font-weight: 800;
}

.main-nav a.active {
  background: #3986e8;
  color: white;
}


/* =========================================================
   COMMON CARD
========================================================= */

.card {
  background: white;

  border-radius: 22px;

  box-shadow:
    0 5px 22px
    rgba(45,60,90,.08);
}


/* =========================================================
   SETUP SCREEN
========================================================= */

.setup-card {
  max-width: 1000px;

  margin: 0 auto;

  padding: 30px;
}

.setup-title {
  font-size: 28px;
  font-weight: 900;

  margin-bottom: 8px;
}

.setup-subtitle {
  color: #778399;

  margin-bottom: 28px;
}

.setup-section {
  margin-bottom: 28px;
}

.setup-label {
  font-size: 18px;
  font-weight: 900;

  margin-bottom: 12px;
}

.option-grid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 12px;
}

.count-grid {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 12px;
}

.option-button {
  min-height: 70px;

  padding: 12px;

  border:
    2px solid
    #e0e6ef;

  background: #f9fbfe;

  border-radius: 16px;

  font-size: 16px;
  font-weight: 800;

  color: #31405a;
}

.option-button small {
  display: block;

  margin-top: 5px;

  font-size: 12px;

  opacity: .7;
}

.option-button.active {
  background: #3986e8;
  color: white;

  border-color: #3986e8;
}

.range-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.range-select label { display: block; margin-bottom: 7px; color: #65738a; font-size: 13px; font-weight: 800; }
.range-select select { width: 100%; padding: 13px; border: 2px solid #e0e6ef; border-radius: 13px; background: #f9fbfe; color: #31405a; font-size: 15px; font-weight: 800; }
#testLessonField { display: none; }

@media (max-width: 640px) { .range-grid { grid-template-columns: 1fr; } }

.start-button {
  width: 100%;

  padding: 18px;

  border: 0;
  border-radius: 16px;

  background: #3986e8;
  color: white;

  font-size: 20px;
  font-weight: 900;
}

.setup-note {
  margin-top: 14px;

  text-align: center;

  color: #7c8798;
}


/* =========================================================
   TEST STATUS
========================================================= */

#testScreen {
  display: none;
}

.status-grid {
  display: grid;

  grid-template-columns:
    2fr 1fr 1fr;

  gap: 12px;

  margin-bottom: 16px;
}

.status-card {
  padding: 18px 20px;

  border-radius: 18px;

  background: white;

  box-shadow:
    0 4px 18px
    rgba(45,60,90,.07);
}

.status-title {
  color: #738097;

  font-size: 14px;
  font-weight: 800;
}

.status-number {
  margin-top: 5px;

  font-size: 24px;
  font-weight: 900;
}

.progress-bar {
  height: 9px;

  margin-top: 10px;

  overflow: hidden;

  border-radius: 99px;

  background: #e8edf4;
}

.progress-fill {
  height: 100%;
  width: 0;

  border-radius: 99px;

  background: #43bf76;
}


/* =========================================================
   TEST LAYOUT
========================================================= */

.test-layout {
  display: grid;

  grid-template-columns:
    minmax(0, 65%)
    minmax(330px, 35%);

  gap: 18px;

  align-items: start;
}

.test-card {
  padding: 26px;
}

.info-card {
  padding: 24px;

  min-height: 620px;
}


/* =========================================================
   QUESTION
========================================================= */

.question-type {
  display: inline-block;

  padding: 8px 14px;

  margin-bottom: 20px;

  border-radius: 12px;

  background: #eaf4ff;
  color: #286eb6;

  font-weight: 900;
}

.question-box {
  min-height: 190px;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 15px;

  flex-wrap: wrap;
}

.question-main {
  font-size:
    clamp(
      48px,
      7vw,
      84px
    );

  font-weight: 900;

  line-height: 1.1;

  word-break: break-word;
}

.speaker-button {
  width: 58px;
  height: 58px;

  border: 0;

  border-radius: 50%;

  background: #e2f0ff;

  font-size: 25px;
}

.answer-input {
  width: 100%;

  margin-top: 15px;

  padding: 17px;

  border:
    2px solid
    #d8dee9;

  border-radius: 14px;

  font-size: 28px;

  text-align: center;

  outline: none;
}

.answer-input:focus {
  border-color: #3986e8;
}

.check-button {
  width: 100%;

  margin-top: 14px;

  padding: 16px;

  border: 0;
  border-radius: 15px;

  background: #3986e8;
  color: white;

  font-size: 18px;
  font-weight: 900;
}


/* =========================================================
   RESULT
========================================================= */

.result-box {
  display: none;

  margin-top: 16px;

  padding: 20px;

  border-radius: 16px;
}

.result-box.correct {
  display: block;

  background: #eaf9ef;
  color: #177241;
}

.result-box.wrong {
  display: block;

  background: #fff0f3;
  color: #a62945;
}

.result-main {
  font-size: 24px;
  font-weight: 900;
}

.result-detail {
  margin-top: 9px;

  font-size: 17px;

  line-height: 1.8;
}

.answer-sound {
  width: 38px;
  height: 38px;

  margin-left: 8px;

  border: 0;

  border-radius: 50%;

  background: #e4f0ff;
}


/* =========================================================
   START HANDWRITING BUTTON
========================================================= */

.start-handwriting-button {
  display: none;

  width: 100%;

  margin-top: 16px;

  padding: 17px;

  border: 0;

  border-radius: 15px;

  background: #ffdd7f;

  color: #6d4b00;

  font-size: 19px;
  font-weight: 900;
}

.handwriting-done-notice {
  display: none;

  margin-top: 16px;

  padding: 15px 17px;

  border-radius: 14px;

  background: #eaf7ef;

  color: #1c7a44;

  font-size: 16px;
  font-weight: 800;

  line-height: 1.6;
}

.next-button {
  display: none;

  width: 100%;

  margin-top: 16px;

  padding: 16px;

  border: 0;

  border-radius: 15px;

  background: #3986e8;

  color: white;

  font-size: 18px;
  font-weight: 900;
}


/* =========================================================
   LOCKED RIGHT PANEL
========================================================= */

.info-title {
  margin-bottom: 18px;

  font-size: 23px;
  font-weight: 900;
}

.info-locked {
  min-height: 500px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
}

.lock-box {
  width: 100%;

  padding: 38px 24px;

  background: #f4f7fb;

  border-radius: 18px;

  color: #6f7d92;
}

.lock-icon {
  margin-bottom: 14px;

  font-size: 52px;
}

.lock-title {
  margin-bottom: 9px;

  color: #41506a;

  font-size: 20px;
  font-weight: 900;
}

.lock-text {
  font-size: 15px;

  line-height: 1.8;
}


/* =========================================================
   RIGHT INFO AFTER ANSWER
========================================================= */

.info-word-row {
  display: flex;

  justify-content: space-between;
  align-items: center;

  gap: 10px;
}

.info-word-main {
  display: flex;
  align-items: center;

  gap: 10px;

  min-width: 0;
}

.info-word {
  font-size: 38px;
  font-weight: 900;

  word-break: break-word;
}

.small-speaker {
  width: 43px;
  height: 43px;

  border: 0;

  border-radius: 50%;

  background: #e2f0ff;

  font-size: 20px;
}

.badge {
  padding: 7px 12px;

  border-radius: 10px;

  font-size: 13px;
  font-weight: 900;

  white-space: nowrap;
}

.badge-verb {
  background: #dff6e9;
  color: #23804b;
}

.badge-noun {
  background: #e2f1ff;
  color: #2677bb;
}

.badge-adjective {
  background: #fff0d9;
  color: #9e6b12;
}

.badge-other {
  background: #eeeef2;
  color: #697385;
}

.info-section {
  margin-top: 18px;
}

.info-label {
  margin-bottom: 8px;

  color: #4b73a6;

  font-size: 14px;
  font-weight: 900;
}

.meaning-box {
  padding: 14px;

  border-radius: 12px;

  background: #f2f5f8;

  font-size: 20px;
  font-weight: 800;
}

.forms-box {
  overflow: hidden;

  border:
    1px solid
    #e1e6ed;

  border-radius: 14px;
}

.form-row {
  display: grid;

  grid-template-columns:
    110px 1fr auto;

  border-bottom:
    1px solid
    #e5e9ef;
}

.form-row:last-child {
  border-bottom: 0;
}

.form-name {
  padding: 11px;

  background: #eef9f2;

  font-weight: 800;
}

.form-value {
  padding: 11px;
}

.form-sound {
  display: flex;

  align-items: center;

  padding: 5px 7px;
}

.form-sound button {
  width: 33px;
  height: 33px;

  border: 0;

  border-radius: 50%;

  background: #e9f4ff;
}


/* =========================================================
   MEMO
========================================================= */

.memo-box {
  margin-top: 20px;

  padding: 16px;

  border-radius: 16px;

  background: #eef6ff;
}

.memo-title {
  margin-bottom: 9px;

  color: #37679e;

  font-size: 17px;
  font-weight: 900;
}

.memo-box textarea {
  width: 100%;
  min-height: 150px;

  padding: 12px;

  border:
    1px solid
    #cfdbe8;

  border-radius: 11px;

  font-family: inherit;
  font-size: 16px;

  resize: vertical;
}

.memo-save {
  width: 100%;

  margin-top: 8px;

  padding: 11px;

  border: 0;

  border-radius: 11px;

  background: #4e94d8;

  color: white;

  font-weight: 900;
}


/* =========================================================
   FULLSCREEN HANDWRITING OVERLAY
========================================================= */

.handwriting-overlay {
  display: none;

  position: fixed;

  inset: 0;

  z-index: 9999;

  padding: 18px;

  background:
    rgba(
      244,
      248,
      252,
      .99
    );

  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
}

body.handwriting-open {
  overflow: hidden;
  overscroll-behavior: none;
}

.handwriting-fullscreen {
  height: 100%;

  display: grid;

  grid-template-rows:
    auto
    minmax(0, 1fr)
    auto;

  gap: 16px;
}

.handwriting-top {
  display: flex;

  justify-content: space-between;
  align-items: center;

  gap: 16px;

  padding:
    8px
    8px
    0;
}

.handwriting-big-title {
  font-size: 30px;
  font-weight: 900;
}

.handwriting-answer-row {
  margin-top: 7px;

  display: flex;
  align-items: center;

  gap: 12px;
}

.handwriting-answer-label {
  color: #255fbe;

  font-size: 46px;
  font-weight: 900;
}

.handwriting-sound {
  width: 48px;
  height: 48px;

  border: 0;

  border-radius: 50%;

  background: #e0efff;

  font-size: 22px;
}

.handwriting-step-badge {
  min-width: 125px;

  padding: 14px 18px;

  border-radius: 18px;

  background: #eaf1ff;

  color: #2f67b7;

  text-align: center;

  font-size: 28px;
  font-weight: 900;
}


/* =========================================================
   BIG CANVAS
========================================================= */

.handwriting-canvas-wrap {
  min-height: 0;

  position: relative;

  overflow: hidden;

  border:
    3px solid
    #3986e8;

  border-radius: 24px;

  background: #f8fbff;

  box-shadow:
    0 0 0 5px rgba(57, 134, 232, .09),
    inset 0 0 24px rgba(57, 134, 232, .06);

  touch-action: none;
}

.handwriting-canvas-guide {
  position: absolute;
  top: 12px;
  left: 50%;
  z-index: 1;

  transform: translateX(-50%);

  padding: 7px 13px;
  border-radius: 999px;

  background: rgba(232, 241, 255, .94);
  color: #2f67b7;

  font-size: 14px;
  font-weight: 900;
  white-space: nowrap;

  pointer-events: none;
}

.full-write-canvas {
  display: block;

  width: 100%;
  height: 100%;

  min-height: 55vh;

  touch-action: none;

  -webkit-user-select: none;
  user-select: none;

  background:

    repeating-linear-gradient(

      to bottom,

      #ffffff
      0,

      #ffffff
      105px,

      #d9e7f7
      106px,

      #ffffff
      107px,

      #ffffff
      210px

    );
}


/* =========================================================
   HANDWRITING FOOTER
========================================================= */

.handwriting-bottom {
  display: grid;

  grid-template-columns:
    1fr
    1fr
    1.5fr;

  gap: 12px;
}

.overlay-sub-button,
.overlay-main-button {
  padding: 18px;

  border: 0;

  border-radius: 17px;

  font-size: 19px;
  font-weight: 900;
}

.overlay-sub-button {
  background: #eef2f8;
  color: #42516c;
}

.overlay-main-button {
  background: #3986e8;
  color: white;
}


/* =========================================================
   FINAL SCREEN
========================================================= */

.final-result {
  max-width: 1000px;

  margin: auto;
}

.final-grid {
  display: grid;

  grid-template-columns:
    1fr
    1.3fr;

  gap: 18px;
}

.final-score {
  padding: 28px;

  text-align: center;
}

.big-score {
  font-size: 72px;
  font-weight: 900;
}

.big-rate {
  margin-top: 10px;

  font-size: 28px;
  font-weight: 900;
}

.wrong-list-card {
  padding: 26px;
}

.wrong-item {
  padding: 14px;

  margin-bottom: 10px;

  border-radius: 13px;

  background: #fff3f5;
}

.wrong-word {
  font-size: 19px;
  font-weight: 900;
}

.wrong-detail {
  margin-top: 6px;

  line-height: 1.7;
}

.final-actions {
  display: grid;

  grid-template-columns:
    1.3fr
    1fr
    1fr;

  gap: 12px;

  margin-top: 18px;
}

.final-actions button {
  padding: 15px;

  border: 0;

  border-radius: 14px;

  font-size: 16px;
  font-weight: 900;
}

.retry-wrong {
  background: #ffd977;
}

.select-again {
  background: #3986e8;
  color: white;
}

.back-study {
  background: #e7ecf3;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (
  max-width: 1000px
) {

  .option-grid {
    grid-template-columns:
      repeat(2,1fr);
  }

  .test-layout {
    grid-template-columns:
      1fr;
  }

  .final-grid {
    grid-template-columns:
      1fr;
  }

}


@media (
  max-width: 700px
) {

  body {
    padding: 13px;
  }

  .header {
    display: block;
  }

  .main-nav {
    margin-top: 12px;
  }

  .main-nav a {
    min-width: 0;

    flex: 1;

    padding: 10px 6px;
  }

  .option-grid,
  .count-grid,
  .status-grid,
  .final-actions {
    grid-template-columns:
      1fr;
  }

  .handwriting-top {
    display: block;
  }

  .handwriting-step-badge {
    margin-top: 10px;
  }

  .handwriting-answer-label {
    font-size: 34px;
  }

  .handwriting-bottom {
    grid-template-columns:
      1fr;
  }

}

</style>

</head>


<body>


<div class="app">


<!-- ======================================================
     HEADER
====================================================== -->

<header class="header">

  <div class="logo">
    MY WORDS

    <span>
      テストモード
    </span>
  </div>


<nav class="main-nav">

  <a href="index.html">
    📖 学習
  </a>

  <a href="test.html" class="active">
    ✏️ テスト
  </a>

  <a href="admin.html">
    ⚙️ 管理
  </a>

  <a href="guide.html">
    ❓ 使い方
  </a>

</nav>

</header>



<!-- ======================================================
     SETUP
====================================================== -->

<section
  id="setupScreen"
  class="card setup-card">


  <div class="setup-title">
    テストを選ぼう
  </div>

  <div class="setup-subtitle">
    テストの種類と問題数を選んでください。
  </div>


  <div class="setup-section">
    <div class="setup-label">単語の範囲</div>
    <div class="range-grid">
      <div class="range-select">
        <label for="testPresetRange">範囲</label>
        <select id="testPresetRange" onchange="changeTestPresetRange()">
          <option value="all">すべて</option>
          <option value="elementary-300">小学校英語300語</option>
          <option value="eiken4-100">中学初級・4級レベル 基礎100語</option>
        </select>
      </div>
      <div id="testLessonField" class="range-select">
        <label for="testPresetLesson">セット</label>
        <select id="testPresetLesson" onchange="changeTestPresetLesson()"></select>
      </div>
    </div>
  </div>


  <div class="setup-section">

    <div class="setup-label">
      テストの種類
    </div>


    <div class="option-grid">


      <button
        class="option-button test-type active"
        onclick="selectTestType('jaen', this)">

        日本語 → 英語

        <small>
          日本語を見て英語を入力
        </small>

      </button>


      <button
        class="option-button test-type"
        onclick="selectTestType('verb', this)">

        動詞の変化

        <small>
          過去形・過去分詞など
        </small>

      </button>


      <button
        class="option-button test-type"
        onclick="selectTestType('adjective', this)">

        形容詞の変化

        <small>
          比較級・最上級
        </small>

      </button>


      <button
        class="option-button test-type"
        onclick="selectTestType('weak', this)">

        ★ 苦手だけ

        <small>
          苦手単語だけ出題
        </small>

      </button>


    </div>

  </div>



  <div class="setup-section">

    <div class="setup-label">
      問題数
    </div>


    <div class="count-grid">


      <button
        class="option-button count-button active"
        onclick="selectCount(5, this)">
        5問
      </button>


      <button
        class="option-button count-button"
        onclick="selectCount(10, this)">
        10問
      </button>


      <button
        class="option-button count-button"
        onclick="selectCount(20, this)">
        20問
      </button>


      <button
        class="option-button count-button"
        onclick="selectCount('all', this)">
        全部
      </button>


    </div>

  </div>


  <button
    class="start-button"
    onclick="startTest()">

    テストスタート！

  </button>


  <div
    id="setupNote"
    class="setup-note">
  </div>


</section>



<!-- ======================================================
     TEST
====================================================== -->

<section id="testScreen">


  <!-- STATUS -->

  <div class="status-grid">


    <div class="status-card">

      <div class="status-title">
        問題
      </div>

      <div
        id="questionProgress"
        class="status-number">
        1 / 10
      </div>

      <div class="progress-bar">

        <div
          id="progressFill"
          class="progress-fill">
        </div>

      </div>

    </div>



    <div class="status-card">

      <div class="status-title">
        正解
      </div>

      <div
        id="correctCount"
        class="status-number">
        0
      </div>

    </div>



    <div class="status-card">

      <div class="status-title">
        正答率
      </div>

      <div
        id="accuracy"
        class="status-number">
        0%
      </div>

    </div>


  </div>



  <div class="test-layout">


    <!-- ==================================================
         LEFT
    ================================================== -->

    <section class="card test-card">


      <div
        id="questionType"
        class="question-type">
      </div>


      <div class="question-box">


        <div

<!-- ======================================================

====================================================== -->

<div
  id="handwritingOverlay"

  <div class="handwriting-fullscreen">


    <!-- TOP -->

    <div class="handwriting-top">

            🔊

        1 / 3

        1回書いた！ →

<script src="presets.js?v=1"></script>
<script>

/* =========================================================
   DATA
========================================================= */

let words =
  JSON.parse(
    localStorage.getItem(
      "words"
    )
  ) || [];


let weakWords =
  JSON.parse(
    localStorage.getItem(
      "weakWords"
    )
  ) || [];


let memos =
  JSON.parse(
    localStorage.getItem(
      "wordMemos"
    )
  ) || {};

const availablePresets = Array.isArray(window.MY_WORD_PRESETS) ? window.MY_WORD_PRESETS : [];
let selectedPreset = "all";
let selectedLesson = "all";



/* 古いデータ対応 */

words =
  words.map(
    function(word) {

      if (!word.forms) {

        word.forms = {

          base:
            word.english
            || ""

        };

      }


      if (
        !word.partOfSpeech
      ) {

        word.partOfSpeech =
          "other";

      }


      return word;

    }
  );



/* =========================================================
   STATE
========================================================= */

let selectedType =
  "jaen";


let selectedCount =
  5;


let testItems =
  [];


let current =
  0;


let correctCount =
  0;


let answeredCount =
  0;


let answered =
  false;


let wrongAnswers =
  [];


let retryMode =
  false;



/* handwriting */

let handwritingStep =
  1;


let handwritingTargetText =
  "";


let handwritingCompletedForCurrent =
  false;


let fullCanvasHasStroke =
  false;



/* =========================================================
   RANGE
========================================================= */

function getPresetDefinition(presetId) {
  return availablePresets.find(function(preset) { return preset.id === presetId; });
}

function getScopedWords() {
  if (selectedPreset === "all") return words;
  return words.filter(function(word) {
    const memberships = word.presetMemberships || {};
    if (!memberships[selectedPreset]) return false;
    return selectedLesson === "all" || String(memberships[selectedPreset]) === String(selectedLesson);
  });
}

function getDisplayEnglish(word) {
  return word.displayEnglish || word.english;
}

function changeTestPresetRange() {
  selectedPreset = document.getElementById("testPresetRange").value;
  selectedLesson = "all";
  const field = document.getElementById("testLessonField");
  const select = document.getElementById("testPresetLesson");
  const preset = getPresetDefinition(selectedPreset);
  if (preset) {
    select.innerHTML = '<option value="all">全セット</option>' + preset.lessonNames.map(function(name, index) {
      return '<option value="' + (index + 1) + '">セット' + (index + 1) + '：' + name + '</option>';
    }).join("");
    field.style.display = "block";
  } else {
    field.style.display = "none";
  }
  updateSetupNote();
}

function changeTestPresetLesson() {
  selectedLesson = document.getElementById("testPresetLesson").value;
  updateSetupNote();
}

function initializeTestPresetRange() {
  const params = new URLSearchParams(window.location.search);
  const requestedPreset = params.get("preset");
  const requestedLesson = params.get("lesson");
  if (getPresetDefinition(requestedPreset)) {
    document.getElementById("testPresetRange").value = requestedPreset;
    selectedPreset = requestedPreset;
    changeTestPresetRange();
    const preset = getPresetDefinition(requestedPreset);
    if (requestedLesson && Number(requestedLesson) >= 1 && Number(requestedLesson) <= preset.lessonNames.length) {
      document.getElementById("testPresetLesson").value = requestedLesson;
      selectedLesson = requestedLesson;
    }
  }
}

/* =========================================================
   SETTINGS
========================================================= */

function selectTestType(
  type,
  button
) {

  selectedType =
    type;


  document
    .querySelectorAll(
      ".test-type"
    )
    .forEach(
      function(btn) {

        btn.classList
          .remove(
            "active"
          );

      }
    );


  button
    .classList
    .add(
      "active"
    );


  updateSetupNote();

}



function selectCount(
  count,
  button
) {

  selectedCount =
    count;


  document
    .querySelectorAll(
      ".count-button"
    )
    .forEach(
      function(btn) {

        btn.classList
          .remove(
            "active"
          );

      }
    );


  button
    .classList
    .add(
      "active"
    );

}



function updateSetupNote() {

  if (
    selectedType ===
    "weak"
  ) {

    const count =
      getScopedWords()
        .filter(
          function(word) {

            return (
              weakWords
                .includes(
                  word.english
                )
            );

          }
        )
        .length;


    document
      .getElementById(
        "setupNote"
      )
      .textContent =
        "現在の苦手単語："
        +
        count
        +
        "個";

  }


  else {

    document
      .getElementById(
        "setupNote"
      )
      .textContent =
        "選択範囲の単語："
        +
        getScopedWords().length
        +
        "個";

  }

}



/* =========================================================
   BUILD QUESTIONS
========================================================= */

function buildItems(
  type
) {

  const items =
    [];

  const sourceWords = getScopedWords();


  /* 日本語 → 英語 */

  if (
    type ===
    "jaen"
  ) {

    sourceWords.forEach(
      function(word) {

        items.push({

          word: word,

          label:
            "英単語を入力してください",

          question:
            word.japanese,

          answer:
            getDisplayEnglish(word),

          questionIsEnglish:
            false,

          answerIsEnglish:
            true

        });

      }
    );

  }


  /* 苦手 */

  else if (
    type ===
    "weak"
  ) {

    sourceWords
      .filter(
        function(word) {

          return (
            weakWords
              .includes(
                word.english
              )
          );

        }
      )
      .forEach(
        function(word) {

          items.push({

            word: word,

            label:
              "苦手単語をテスト",

            question:
              word.japanese,

            answer:
              word.english,

            questionIsEnglish:
              false,

            answerIsEnglish:
              true

          });

        }
      );

  }



  /* 動詞 */

  else if (
    type ===
    "verb"
  ) {

    sourceWords
      .filter(
        function(word) {

          return (
            word.partOfSpeech
            ===
            "verb"
          );

        }
      )
      .forEach(
        function(word) {

          const f =
            word.forms
            || {};


          const base =
            f.base
            ||
            word.english;


          if (
            f.past
          ) {

            items.push({

              word: word,

              label:
                "過去形にしてください",

              question:
                base,

              answer:
                f.past,

              questionIsEnglish:
                true,

              answerIsEnglish:
                true

            });

          }


          if (
            f.pastParticiple
          ) {

            items.push({

              word: word,

              label:
                "過去分詞にしてください",

              question:
                base,

              answer:
                f.pastParticiple,

              questionIsEnglish:
                true,

              answerIsEnglish:
                true

            });

          }


          if (
            f.ing
          ) {

            items.push({

              word: word,

              label:
                "ing形にしてください",

              question:
                base,

              answer:
                f.ing,

              questionIsEnglish:
                true,

              answerIsEnglish:
                true

            });

          }


          if (
            f.thirdPerson
          ) {

            items.push({

              word: word,

              label:
                "三人称単数現在にしてください",

              question:
                base,

              answer:
                f.thirdPerson,

              questionIsEnglish:
                true,

              answerIsEnglish:
                true

            });

          }

        }
      );

  }



  /* 形容詞 */

  else if (
    type ===
    "adjective"
  ) {

    sourceWords
      .filter(
        function(word) {

          return (
            word.partOfSpeech
            ===
            "adjective"
          );

        }
      )
      .forEach(
        function(word) {

          const f =
            word.forms
            || {};


          const base =
            f.base
            ||
            word.english;


          if (
            f.comparative
          ) {

            items.push({

              word: word,

              label:
                "比較級にしてください",

              question:
                base,

              answer:
                f.comparative,

              questionIsEnglish:
                true,

              answerIsEnglish:
                true

            });

          }


          if (
            f.superlative
          ) {

            items.push({

              word: word,

              label:
                "最上級にしてください",

              question:
                base,

              answer:
                f.superlative,

              questionIsEnglish:
                true,

              answerIsEnglish:
                true

            });

          }

        }
      );

  }


  return items;

}



/* =========================================================
   START TEST
========================================================= */

function startTest() {

  let available =
    buildItems(
      selectedType
    );


  if (
    available.length
    === 0
  ) {

    alert(
      "このテストで使える単語がありません。"
    );

    return;

  }


  available =
    shuffle(
      available
    );


  if (
    selectedCount ===
    "all"
  ) {

    testItems =
      available;

  }


  else {

    testItems =
      available.slice(

        0,

        Math.min(
          selectedCount,
          available.length
        )

      );

  }


  retryMode =
    false;


  prepareTest();

}



/* =========================================================
   PREPARE
========================================================= */

function prepareTest() {

  current =
    0;


  correctCount =
    0;


  answeredCount =
    0;


  answered =
    false;


  wrongAnswers =
    [];


  document
    .getElementById(
      "setupScreen"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "finalScreen"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "testScreen"
    )
    .style.display =
      "block";


  showQuestion();

}



/* =========================================================
   SHOW QUESTION
========================================================= */

function showQuestion() {

  answered =
    false;


  handwritingStep =
    1;


  handwritingTargetText =
    "";


  handwritingCompletedForCurrent =
    false;


  fullCanvasHasStroke =
    false;


  const handwritingButton =
    document
      .getElementById(
        "openHandwritingButton"
      );


  handwritingButton
    .style.display =
      "none";


  document
    .getElementById(
      "handwritingDoneNotice"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "nextButton"
    )
    .style.display =
      "none";


  const item =
    testItems[
      current
    ];


  document
    .getElementById(
      "questionType"
    )
    .textContent =
      item.label;


  document
    .getElementById(
      "questionMain"
    )
    .textContent =
      item.question;


  document
    .getElementById(
      "questionSpeaker"
    )
    .style.display =
      item.questionIsEnglish
        ? "block"
        : "none";


  const input =
    document
      .getElementById(
        "answerInput"
      );


  input.value =
    "";


  input.disabled =
    false;


  input.placeholder =
    item.answerIsEnglish
      ? "英語を入力"
      : "日本語を入力";


  document
    .getElementById(
      "checkButton"
    )
    .style.display =
      "block";


  const result =
    document
      .getElementById(
        "resultBox"
      );


  result.className =
    "result-box";


  result.innerHTML =
    "";


  /* 答えを見る前はロック */

  renderLockedInfo();


  updateStatus();


  setTimeout(
    function() {

      input.focus();

    },
    100
  );

}



/* =========================================================
   LOCK INFO
========================================================= */

function renderLockedInfo() {

  const info =
    document
      .getElementById(
        "infoContent"
      );


  info.innerHTML = `

    <div class="info-locked">

      <div class="lock-box">

        <div class="lock-icon">
          🔒
        </div>

        <div class="lock-title">
          テスト中
        </div>

        <div class="lock-text">

          答え合わせをすると<br>

          単語の意味・変化形・メモなどの<br>

          詳しい情報が表示されます。

        </div>

      </div>

    </div>

  `;

}



/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer() {

  if (
    answered
  ) {
    return;
  }


  const item =
    testItems[
      current
    ];


  let userAnswer =
    document
      .getElementById(
        "answerInput"
      )
      .value
      .trim();


  if (
    !userAnswer
  ) {

    alert(
      "答えを入力してください"
    );

    return;

  }


  let correctAnswer =
    item.answer;


  if (
    item.answerIsEnglish
  ) {

    userAnswer =
      normalizeEnglish(
        userAnswer
      );


    correctAnswer =
      normalizeEnglish(
        correctAnswer
      );

  }


  answered =
    true;


  answeredCount++;


  const result =
    document
      .getElementById(
        "resultBox"
      );


  /* =====================================================
     CORRECT
  ===================================================== */

  if (
    userAnswer ===
    correctAnswer
  ) {

    correctCount++;


    result.className =
      "result-box correct";


    result.innerHTML = `

      <div class="result-main">

        🎉 正解！

      </div>


      <div class="result-detail">

        正解：

        <strong>
          ${escapeHTML(
            item.answer
          )}
        </strong>


        ${
          item.answerIsEnglish
          ?
          `

            <button
              class="answer-sound"
              onclick='speakEnglish(${JSON.stringify(item.answer)})'>

              🔊

            </button>

          `
          :
          ""
        }

      </div>

    `;


    document
      .getElementById(
        "openHandwritingButton"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "nextButton"
      )
      .style.display =
        "block";

  }


  /* =====================================================
     WRONG
  ===================================================== */

  else {

    addWeakWord(
      item.word.english
    );


    wrongAnswers.push({

      item:
        item,

      userAnswer:
        userAnswer,

      correctAnswer:
        item.answer

    });


    result.className =
      "result-box wrong";


    result.innerHTML = `

      <div class="result-main">

        ❌ ざんねん

      </div>


      <div class="result-detail">

        あなたの答え：

        <strong>
          ${escapeHTML(
            userAnswer
          )}
        </strong>

        <br>


        正解：

        <strong>
          ${escapeHTML(
            item.answer
          )}
        </strong>


        ${
          item.answerIsEnglish
          ?
          `

            <button
              class="answer-sound"
              onclick='speakEnglish(${JSON.stringify(item.answer)})'>

              🔊

            </button>

          `
          :
          ""
        }


        <br>

        ★ 苦手単語に追加しました

      </div>

    `;


    /* 英語を間違えた場合だけ手書き */

    if (
      item.answerIsEnglish
    ) {

      handwritingTargetText =
        item.answer;


      handwritingStep =
        1;


      handwritingCompletedForCurrent =
        false;


      document
        .getElementById(
          "openHandwritingButton"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "handwritingDoneNotice"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "nextButton"
        )
        .style.display =
          "none";

    }


    else {

      document
        .getElementById(
          "nextButton"
        )
        .style.display =
          "block";

    }

  }



  document
    .getElementById(
      "answerInput"
    )
    .disabled =
      true;


  document
    .getElementById(
      "checkButton"
    )
    .style.display =
      "none";


  /* 答え合わせ後に情報を表示 */

  renderInfo(
    item.word
  );


  updateStatus();

}



/* =========================================================
   FULLSCREEN HANDWRITING
========================================================= */

function openHandwritingPractice() {

  if (
    !handwritingTargetText
  ) {
    return;
  }


  handwritingStep =
    1;


  document
    .getElementById(
      "handwritingAnswerLabel"
    )
    .textContent =
      handwritingTargetText;


  document
    .getElementById(
      "handwritingOverlay"
    )
    .style.display =
      "block";


  document.body.classList.add(
    "handwriting-open"
  );


  updateHandwritingStepUI();


  resizeFullCanvas(false);

  clearFullCanvas();

}



/* 途中で戻る */

function closeHandwritingPractice() {

  document
    .getElementById(
      "handwritingOverlay"
    )
    .style.display =
      "none";


  document.body.classList.remove(
    "handwriting-open"
  );

}



/* 1回完了 */

function completeOneWriting() {

  if (
    !fullCanvasHasStroke
  ) {

    alert(
      "1回書いてから進んでください。"
    );

    return;

  }


  if (
    handwritingStep < 3
  ) {

    handwritingStep++;


    updateHandwritingStepUI();


    clearFullCanvas();

  }


  else {

    handwritingCompletedForCurrent =
      true;


    document
      .getElementById(
        "handwritingOverlay"
      )
      .style.display =
        "none";


    document.body.classList.remove(
      "handwriting-open"
    );


    document
      .getElementById(
        "openHandwritingButton"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "handwritingDoneNotice"
      )
      .style.display =
        "block";


    document
      .getElementById(
        "nextButton"
      )
      .style.display =
        "block";


    /*
      元の不正解画面の
      メモ欄へ戻る
    */

    setTimeout(
      function() {

        const memoInput =
          document
            .getElementById(
              "memoInput"
            );


        if (
          memoInput
        ) {

          memoInput.focus();

        }

      },
      100
    );

  }

}



/* 進捗 */

function updateHandwritingStepUI() {

  document
    .getElementById(
      "handwritingStepBadge"
    )
    .textContent =
      handwritingStep
      +
      " / 3";


  const button =
    document
      .getElementById(
        "completeWritingButton"
      );


  if (
    handwritingStep < 3
  ) {

/* =========================================================
   BIG CANVAS
========================================================= */

const fullWriteCanvas =

function setupFullCanvas(
  canvas
) {

  let activePointerId =
    null;


  function getPointerPosition(
    event
  ) {

    const rect =
      canvas
        .getBoundingClientRect();


    return {

      x:
        event.clientX
        -
        rect.left,

      y:
        event.clientY
        -
        rect.top

    };

  }



  canvas.addEventListener(
    "pointerdown",
    function(event) {

      event.preventDefault();


      if (
        activePointerId !== null
      ) {
        return;
      }


      activePointerId =
        event.pointerId;


      fullCanvasHasStroke =
        true;


      try {

        canvas
          .setPointerCapture(
            event.pointerId
          );

      }

      catch(e) {}


      const ctx =
        canvas
          .getContext(
            "2d"
          );


      const point =
        getPointerPosition(
          event
        );


      ctx.beginPath();


      ctx.moveTo(
        point.x,
        point.y
      );

    }
  );



  canvas.addEventListener(
    "pointermove",
    function(event) {

      if (
        event.pointerId !== activePointerId
      ) {
        return;
      }


      event.preventDefault();


      const ctx =
        canvas
          .getContext(
            "2d"
          );


      const point =
        getPointerPosition(
          event
        );


      ctx.lineWidth =
        6;


      ctx.lineCap =
        "round";


      ctx.lineJoin =
        "round";


      ctx.strokeStyle =
        "#4e596a";


      ctx.lineTo(
        point.x,
        point.y
      );


      ctx.stroke();

    }
  );



  function stopDrawing(event) {

    if (
      event.pointerId !== activePointerId
    ) {
      return;
    }


    activePointerId =
      null;

  }


  canvas.addEventListener(
    "pointerup",
    stopDrawing
  );


  canvas.addEventListener(
    "pointercancel",
    stopDrawing
  );


  canvas.addEventListener(
    "pointerleave",
    function(event) {

      if (
        event.pointerId === activePointerId
        &&
        (
          !canvas.hasPointerCapture
          ||
          !canvas.hasPointerCapture(event.pointerId)
        )
      ) {

        activePointerId =
          null;

      }

    }
  );

}



/* サイズ */

function resizeFullCanvas(
  preserveDrawing
) {

  const canvas =
    fullWriteCanvas;


  const rect =
    canvas
      .getBoundingClientRect();


  if (
    rect.width === 0
    ||
    rect.height === 0
  ) {
    return;
  }


  const ratio =
    window
      .devicePixelRatio
    || 1;


  const nextWidth =
    Math.floor(
      rect.width
      *
      ratio
    );


  const nextHeight =
    Math.floor(
      rect.height
      *
      ratio
    );


  if (
    canvas.width === nextWidth
    &&
    canvas.height === nextHeight
  ) {
    return;
  }


  let snapshot =
    null;


  if (
    preserveDrawing
    &&
    fullCanvasHasStroke
    &&
    canvas.width > 0
    &&
    canvas.height > 0
  ) {

    snapshot =
      document.createElement(
        "canvas"
      );


    snapshot.width =
      canvas.width;


    snapshot.height =
      canvas.height;


    snapshot
      .getContext(
        "2d"
      )
      .drawImage(
        canvas,
        0,
        0
      );

  }


  canvas.width =
    nextWidth;


  canvas.height =
    nextHeight;


  const ctx =
    canvas
      .getContext(
        "2d"
      );


  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );


  if (
    snapshot
  ) {

    ctx.save();

    ctx.setTransform(
      1,
      0,
      0,
      1,
      0,
      0
    );

    ctx.drawImage(
      snapshot,
      0,
      0,
      snapshot.width,
      snapshot.height,
      0,
      0,
      nextWidth,
      nextHeight
    );

    ctx.restore();

  }

  else {

    fullCanvasHasStroke =
      false;

  }

}



/* 消去 */

function clearFullCanvas() {

  const ctx =
    fullWriteCanvas
      .getContext(
        "2d"
      );


  ctx.save();


  ctx.setTransform(
    1,
    0,
    0,
    1,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    fullWriteCanvas.width,
    fullWriteCanvas.height
  );


  ctx.restore();


  fullCanvasHasStroke =
    false;

}

/* =========================================================
   AUDIO
========================================================= */

function speakEnglish(
  text
) {

  if (
    !text
    ||
    !(
      "speechSynthesis"
      in window
    )
  ) {

    return;

  }


  speechSynthesis
    .cancel();


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.lang =
    "en-US";


  speech.rate =
    0.8;


  const voices =
    speechSynthesis
      .getVoices();


  const voice =
    voices.find(
      function(v) {

        return (

          v.lang
          &&
          v.lang
            .toLowerCase()
            .startsWith(
              "en-us"
            )

        );

      }
    )
    ||
    voices.find(
      function(v) {

        return (

          v.lang
          &&
          v.lang
            .toLowerCase()
            .startsWith(
              "en"
            )

        );

      }
    );


  if (
    voice
  ) {

    speech.voice =
      voice;

  }


  speechSynthesis
    .speak(
      speech
    );

}



function speakQuestion() {

  if (
    testItems.length
    === 0
  ) {
    return;
  }


  const item =
    testItems[
      current
    ];


  if (
    item.questionIsEnglish
  ) {

    speakEnglish(
      item.question
    );

  }

}

    <div class="info-word-row">


      <div class="info-word-main">


        <div class="info-word">

          ${escapeHTML(
            getDisplayEnglish(word)
          )}

        </div>


        <button
          class="small-speaker"
          onclick='speakEnglish(${JSON.stringify(getDisplayEnglish(word))})'>

          🔊

      <div class="memo-title">

      <button

  }


  if (

  ) {

    return `

  }

/* =========================================================
   UTILITIES
========================================================= */

function normalizeEnglish(
  text
) {

  return text

    .replace(
      /[Ａ-Ｚａ-ｚ０-９]/g,

      function(character) {

        return String
          .fromCharCode(

            character
              .charCodeAt(0)
            -
            0xFEE0

          );

      }
    )

    .replace(
      /　/g,
      " "
    )

    .trim()

    .toLowerCase();

}



function shuffle(
  array
) {

  const copied =
    [
      ...array
    ];


  for (

    let i =
      copied.length
      -
      1;

    i > 0;

    i--

  ) {

    const j =
      Math.floor(

        Math.random()
        *
        (
          i
          +
          1
        )

      );


    [
      copied[i],
      copied[j]
    ]
    =
    [
      copied[j],
      copied[i]
    ];

  }


  return copied;

}



function escapeHTML(
  text
) {

  const div =
    document
      .createElement(
        "div"
      );


  div.textContent =
    text
    ||
    "";


  return div.innerHTML;

}
