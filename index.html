<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY WORDS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #222;
    }

    .app {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      margin-top: 0;
      color: #777;
    }

    .nav {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .nav a {
      text-decoration: none;
      background: #333;
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
    }

    .mode {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .mode button {
      flex: 1;
      margin: 0;
    }

    .mode-button {
      background: #eee;
    }

    .mode-button.active {
      background: #333;
      color: white;
    }

    .card {
      background: white;
      padding: 30px 22px;
      margin-top: 15px;
      border-radius: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .status {
      font-size: 14px;
      color: #777;
      margin-bottom: 18px;
    }

    .word {
      font-size: 36px;
      font-weight: bold;
      margin: 15px 0 25px;
    }

    .meaning {
      font-size: 25px;
      min-height: 40px;
      margin-bottom: 20px;
    }

    .weak-mark {
      display: none;
      font-size: 14px;
      color: #d86b00;
      font-weight: bold;
      margin-bottom: 12px;
    }

    button {
      padding: 13px 18px;
      margin: 7px 0;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    .answer {
      background: #e7e7ff;
    }

    .next {
      background: #ddd;
    }

    .clear-weak {
      display: none;
      background: #fff1d6;
    }

    .empty {
      color: #777;
      line-height: 1.8;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>MY WORDS</h1>
  <p class="subtitle">学習モード</p>

  <div class="nav">
    <a href="index.html">📖 学習</a>
    <a href="test.html">✏️ テスト</a>
    <a href="admin.html">⚙️ 管理</a>
  </div>

  <div class="mode">

    <button
      id="allButton"
      class="mode-button active"
      onclick="setMode('all')">
      すべて
    </button>

    <button
      id="weakButton"
      class="mode-button"
      onclick="setMode('weak')">
      苦手だけ
    </button>

  </div>

  <div class="card">

    <div id="studyArea">

      <div
        class="status"
        id="status">
      </div>

      <div
        class="weak-mark"
        id="weakMark">
        ★ 苦手単語
      </div>

      <div
        class="word"
        id="word">
      </div>

      <div
        class="meaning"
        id="meaning">
      </div>

      <button
        class="answer"
        onclick="showAnswer()">
        答えを見る
      </button>

      <button
        class="next"
        onclick="nextWord()">
        次の単語 →
      </button>

      <button
        class="clear-weak"
        id="clearWeakButton"
        onclick="clearWeak()">
        ✓ 苦手を解除する
      </button>

    </div>

  </div>

</div>

<script>

let words =
  JSON.parse(localStorage.getItem("words")) || [];

let weakWords =
  JSON.parse(localStorage.getItem("weakWords")) || [];

let mode = "all";

let studyWords = [];

let current = 0;


/* -----------------------
   苦手かどうか
----------------------- */

function isWeak(word) {

  return weakWords.includes(word.english);

}


/* -----------------------
   学習モード変更
----------------------- */

function setMode(newMode) {

  mode = newMode;

  current = 0;

  document
    .getElementById("allButton")
    .classList.toggle(
      "active",
      mode === "all"
    );

  document
    .getElementById("weakButton")
    .classList.toggle(
      "active",
      mode === "weak"
    );

  refreshStudyWords();

}


/* -----------------------
   学習対象を更新
----------------------- */

function refreshStudyWords() {

  if (mode === "weak") {

    studyWords =
      words.filter(function(word) {
        return isWeak(word);
      });

  } else {

    studyWords = [...words];

  }


  if (current >= studyWords.length) {
    current = 0;
  }

  showWord();

}


/* -----------------------
   単語表示
----------------------- */

function showWord() {

  const wordElement =
    document.getElementById("word");

  const meaningElement =
    document.getElementById("meaning");

  const statusElement =
    document.getElementById("status");

  const weakMark =
    document.getElementById("weakMark");

  const clearButton =
    document.getElementById(
      "clearWeakButton"
    );


  if (studyWords.length === 0) {

    wordElement.textContent =
      mode === "weak"
        ? "苦手単語はありません 🎉"
        : "単語がありません";

    meaningElement.textContent =
      mode === "weak"
        ? "テストで間違えるとここに追加されます。"
        : "管理画面から単語を登録してください。";

    statusElement.textContent = "";

    weakMark.style.display = "none";

    clearButton.style.display = "none";

    return;

  }


  const word =
    studyWords[current];


  wordElement.textContent =
    word.english;

  meaningElement.textContent =
    "？？？";


  statusElement.textContent =
    (current + 1) +
    " / " +
    studyWords.length;


  if (isWeak(word)) {

    weakMark.style.display =
      "block";

    clearButton.style.display =
      "block";

  } else {

    weakMark.style.display =
      "none";

    clearButton.style.display =
      "none";

  }

}


/* -----------------------
   答え表示
----------------------- */

function showAnswer() {

  if (studyWords.length === 0) {
    return;
  }

  document
    .getElementById("meaning")
    .textContent =
      studyWords[current].japanese;

}


/* -----------------------
   次の単語
----------------------- */

function nextWord() {

  if (studyWords.length === 0) {
    return;
  }

  current++;

  if (current >= studyWords.length) {
    current = 0;
  }

  showWord();

}


/* -----------------------
   苦手解除
----------------------- */

function clearWeak() {

  if (studyWords.length === 0) {
    return;
  }

  const english =
    studyWords[current].english;


  weakWords =
    weakWords.filter(function(word) {
      return word !== english;
    });


  localStorage.setItem(
    "weakWords",
    JSON.stringify(weakWords)
  );


  refreshStudyWords();

}


/* -----------------------
   開始
----------------------- */

refreshStudyWords();

</script>

</body>
</html>
