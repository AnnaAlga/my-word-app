<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY WORDS 学習</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px;
  background: #f4f8fc;
  color: #243149;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
a,
textarea {
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 1400px;
  margin: auto;
}

/* =========================
   HEADER
========================= */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 18px;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 1px;
}

.logo span {
  margin-left: 10px;
  font-size: 19px;
  color: #76839a;
  font-weight: 700;
}

.main-nav {
  display: flex;
  gap: 10px;
}

.main-nav a {
  min-width: 120px;
  padding: 13px 18px;
  text-decoration: none;
  text-align: center;
  color: #243149;
  background: #eaf1fa;
  border-radius: 14px;
  font-weight: 800;
}

.main-nav a.active {
  background: #3986e8;
  color: white;
}

/* =========================
   MODE NAV
========================= */

.mode-nav {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.mode-button {
  min-height: 72px;
  padding: 12px 8px;
  border: 0;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  background: #edf2f8;
  color: #31405a;
}

.mode-button small {
  display: block;
  margin-top: 5px;
  font-size: 11px;
  font-weight: 600;
  opacity: .75;
}

.mode-button.active {
  background: #3986e8;
  color: white;
}

.mode-basic {
  background: #eaf3ff;
}

.mode-jaen {
  background: #fff0f3;
}

.mode-verb {
  background: #eaf8ef;
}

.mode-adjective {
  background: #fff5df;
}

.mode-weak {
  background: #f0edff;
}

/* =========================
   MAIN LAYOUT
========================= */

.study-layout {
  display: grid;
  grid-template-columns: minmax(0, 64%) minmax(340px, 36%);
  gap: 18px;
  align-items: stretch;
}

.card {
  background: white;
  border-radius: 22px;
  box-shadow: 0 5px 22px rgba(45,60,90,.08);
}

/* =========================
   LEFT
========================= */

.study-card {
  padding: 28px;
}

.study-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 20px;
}

.study-title {
  font-size: 26px;
  font-weight: 900;
}

.study-description {
  margin-top: 6px;
  color: #79859a;
  font-size: 15px;
}

.progress-area {
  min-width: 180px;
  text-align: right;
}

.progress-number {
  font-size: 18px;
  font-weight: 800;
}

.progress-bar {
  height: 8px;
  background: #e7ecf3;
  border-radius: 999px;
  margin-top: 9px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: #3986e8;
  border-radius: 999px;
}

/* =========================
   QUESTION
========================= */

.question-box {
  min-height: 290px;
  border-radius: 22px;
  background: linear-gradient(
    135deg,
    #edf6ff,
    #f9fbfe
  );
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  margin-bottom: 18px;
}

.question-label {
  font-size: 15px;
  color: #76839a;
  font-weight: 700;
  margin-bottom: 14px;
}

.question-word-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  max-width: 100%;
}

.question-main {
  font-size: clamp(42px, 6vw, 72px);
  line-height: 1.1;
  font-weight: 900;
  word-break: break-word;
  text-align: center;
}

.question-sub {
  margin-top: 15px;
  font-size: 18px;
  color: #68748a;
  text-align: center;
}

/* =========================
   SPEAKER
========================= */

.speaker-button {
  width: 58px;
  height: 58px;
  flex: 0 0 58px;
  border: 0;
  border-radius: 50%;
  background: #dbeeff;
  font-size: 27px;
  cursor: pointer;
}

.speaker-button:active {
  transform: scale(.94);
}

.small-speaker {
  width: 45px;
  height: 45px;
  border: 0;
  border-radius: 50%;
  background: #e2f0ff;
  font-size: 21px;
  cursor: pointer;
}

/* =========================
   ANSWER
========================= */

.answer-box {
  min-height: 105px;
  border-radius: 18px;
  background: #edf9f0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  margin-bottom: 14px;
  font-size: 34px;
  font-weight: 900;
  color: #187743;
}

.answer-hidden {
  color: #9aa5b5;
  font-size: 28px;
}

.answer-visible-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}

.main-action {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 15px;
  background: #3986e8;
  color: white;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
  margin-bottom: 14px;
}

/* =========================
   JUDGE
========================= */

.judge-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 18px;
}

.judge-button {
  padding: 16px;
  border: 0;
  border-radius: 16px;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
}

.remember {
  background: #dff5e5;
  color: #14733e;
}

.unsure {
  background: #ffe3ea;
  color: #a72c49;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.bottom-nav button {
  padding: 15px;
  border: 0;
  border-radius: 15px;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
}

.previous {
  background: #eef2fa;
  color: #354568;
}

.next {
  background: #3986e8;
  color: white;
}

/* =========================
   RIGHT INFO
========================= */

.info-card {
  padding: 24px;
}

.info-title {
  font-size: 24px;
  font-weight: 900;
  margin-bottom: 20px;
}

.info-word-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
}

.info-word-main {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.info-word {
  font-size: 38px;
  font-weight: 900;
  word-break: break-word;
}

.badge {
  padding: 7px 12px;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
}

.badge-verb {
  background: #ffe1e7;
  color: #c8425d;
}

.badge-noun {
  background: #e3f1ff;
  color: #2474b7;
}

.badge-adjective {
  background: #dff5e5;
  color: #258048;
}

.badge-other {
  background: #eeeef2;
  color: #687385;
}

.info-section {
  margin-top: 20px;
}

.info-label {
  font-size: 14px;
  color: #5873a4;
  font-weight: 900;
  margin-bottom: 8px;
}

.meaning-box {
  background: #f3f5f8;
  padding: 14px;
  border-radius: 12px;
  font-size: 20px;
  font-weight: 800;
}

.forms-box {
  border-radius: 15px;
  overflow: hidden;
  border: 1px solid #e0e6ed;
}

.form-row {
  display: grid;
  grid-template-columns: 125px 1fr auto;
  border-bottom: 1px solid #e5e9ef;
}

.form-row:last-child {
  border-bottom: 0;
}

.form-name {
  padding: 11px;
  background: #eef9f2;
  font-size: 14px;
  font-weight: 900;
}

.form-value {
  padding: 11px;
  background: white;
  font-size: 16px;
}

.form-sound {
  display: flex;
  align-items: center;
  padding: 5px 8px;
  background: white;
}

.form-sound button {
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 50%;
  background: #edf5ff;
  cursor: pointer;
}

/* =========================
   MEMO
========================= */

.memo-box {
  margin-top: 22px;
  background: #fff0f3;
  border-radius: 16px;
  padding: 16px;
}

.memo-title {
  font-size: 17px;
  font-weight: 900;
  color: #a63350;
  margin-bottom: 9px;
}

.memo-box textarea {
  width: 100%;
  min-height: 150px;
  resize: vertical;
  border: 1px solid #e1cad1;
  border-radius: 12px;
  padding: 13px;
  font-size: 16px;
  font-family: inherit;
}

.memo-save {
  width: 100%;
  margin-top: 9px;
  padding: 11px;
  border: 0;
  border-radius: 11px;
  background: #d95c7c;
  color: white;
  font-weight: 800;
  cursor: pointer;
}

.empty-message {
  padding: 40px 20px;
  text-align: center;
  color: #7f8a9b;
  font-size: 17px;
  line-height: 1.8;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1000px) {

  .mode-nav {
    grid-template-columns:
      repeat(3, 1fr);
  }

  .study-layout {
    grid-template-columns: 1fr;
  }

}

@media (max-width: 700px) {

  body {
    padding: 13px;
  }

  .header {
    display: block;
  }

  .main-nav {
    margin-top: 12px;
  }

  .main-nav a {
    flex: 1;
    min-width: 0;
    padding: 11px 7px;
  }

  .mode-nav {
    grid-template-columns: 1fr 1fr;
  }

  .study-card,
  .info-card {
    padding: 18px;
  }

  .study-top {
    display: block;
  }

  .progress-area {
    margin-top: 12px;
    text-align: left;
  }

  .judge-buttons,
  .bottom-nav {
    grid-template-columns: 1fr;
  }

  .form-row {
    grid-template-columns:
      100px 1fr auto;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="logo">
    MY WORDS
    <span>英単語学習</span>
  </div>

<nav class="main-nav">

  <a href="index.html">
    📖 学習
  </a>

  <a href="test.html">
    ✏️ テスト
  </a>

  <a href="admin.html">
    ⚙️ 管理
  </a>

  <a href="guide.html">
    ❓ 使い方
  </a>

</nav>

</header>


<div class="mode-nav">

  <button
    class="mode-button mode-basic active"
    onclick="setMode('basic', this)">
    📖 基本単語
    <small>英語 → 日本語</small>
  </button>

  <button
    class="mode-button mode-jaen"
    onclick="setMode('jaen', this)">
    ✏️ 日本語から英単語
    <small>日本語 → 英語</small>
  </button>

  <button
    class="mode-button mode-verb"
    onclick="setMode('verb', this)">
    🔁 動詞の変化
    <small>過去形・過去分詞など</small>
  </button>

  <button
    class="mode-button mode-adjective"
    onclick="setMode('adjective', this)">
    👑 形容詞の変化
    <small>比較級・最上級</small>
  </button>

  <button
    class="mode-button mode-weak"
    onclick="setMode('weak', this)">
    ★ 苦手練習
    <small>間違えた単語だけ</small>
  </button>

</div>


<div class="study-layout">

  <section class="card study-card">

    <div class="study-top">

      <div>

        <div
          id="studyTitle"
          class="study-title">
          基本単語モード
        </div>

        <div
          id="studyDescription"
          class="study-description">
        </div>

      </div>


      <div class="progress-area">

        <div
          id="progressNumber"
          class="progress-number">
          0 / 0
        </div>

        <div class="progress-bar">

          <div
            id="progressFill"
            class="progress-fill">
          </div>

        </div>

      </div>

    </div>


    <div class="question-box">

      <div
        id="questionLabel"
        class="question-label">
      </div>


      <div class="question-word-row">

        <div
          id="questionMain"
          class="question-main">
        </div>

        <button
          id="questionSpeaker"
          class="speaker-button"
          onclick="speakQuestion()">
          🔊
        </button>

      </div>


      <div
        id="questionSub"
        class="question-sub">
      </div>

    </div>


    <div
      id="answerArea"
      class="answer-box">

      <span class="answer-hidden">
        ？？？
      </span>

    </div>


    <button
      id="mainAction"
      class="main-action"
      onclick="mainAction()">
      👁 答えを見る
    </button>


    <div
      id="judgeButtons"
      class="judge-buttons">

      <button
        class="judge-button remember"
        onclick="markRemembered()">
        ✓ 覚えた
      </button>

      <button
        class="judge-button unsure"
        onclick="markWeak()">
        ？ まだ不安
      </button>

    </div>


    <div
      id="bottomNav"
      class="bottom-nav">

      <button
        class="previous"
        onclick="previousWord()">
        ← 前の問題
      </button>

      <button
        class="next"
        onclick="nextWord()">
        次の問題 →
      </button>

    </div>

  </section>


  <aside class="card info-card">

    <div class="info-title">
      この単語の情報
    </div>

    <div id="infoContent"></div>

  </aside>

</div>

</div>


<script>

/* =========================
   DATA
========================= */

let words =
  JSON.parse(
    localStorage.getItem(
      "words"
    )
  ) || [];


let weakWords =
  JSON.parse(
    localStorage.getItem(
      "weakWords"
    )
  ) || [];


let memos =
  JSON.parse(
    localStorage.getItem(
      "wordMemos"
    )
  ) || {};


/* 古いデータにも対応 */

words =
  words.map(
    function(word) {

      if (!word.forms) {

        word.forms = {
          base:
            word.english || ""
        };

      }

      if (
        !word.partOfSpeech
      ) {

        word.partOfSpeech =
          "other";

      }

      return word;

    }
  );


let currentMode =
  "basic";

let studyItems =
  [];

let current =
  0;

let answerVisible =
  false;


/* =========================
   AUDIO
========================= */

function speakEnglish(
  text
) {

  if (!text) return;


  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    alert(
      "この端末では音声読み上げを利用できません。"
    );

    return;

  }


  speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.lang =
    "en-US";

  speech.rate =
    0.8;

  speech.pitch =
    1;


  const voices =
    speechSynthesis
      .getVoices();


  const voice =
    voices.find(
      function(v) {

        return (
          v.lang
          &&
          v.lang
            .toLowerCase()
            .startsWith(
              "en-us"
            )
        );

      }
    )
    ||
    voices.find(
      function(v) {

        return (
          v.lang
          &&
          v.lang
            .toLowerCase()
            .startsWith(
              "en"
            )
        );

      }
    );


  if (voice) {

    speech.voice =
      voice;

  }


  speechSynthesis.speak(
    speech
  );

}


function speakQuestion() {

  if (
    studyItems.length
    === 0
  ) {
    return;
  }


  const item =
    studyItems[current];


  if (
    currentMode ===
    "jaen"
  ) {
    return;
  }


  speakEnglish(
    item.question
  );

}


function speakAnswer() {

  if (
    studyItems.length
    === 0
  ) {
    return;
  }


  const item =
    studyItems[current];


  if (
    currentMode ===
      "basic"
    ||
    currentMode ===
      "weak"
  ) {
    return;
  }


  speakEnglish(
    item.answer
  );

}


/* =========================
   MODE
========================= */

function setMode(
  mode,
  button
) {

  currentMode =
    mode;

  current =
    0;

  answerVisible =
    false;


  document
    .querySelectorAll(
      ".mode-button"
    )
    .forEach(
      function(btn) {

        btn.classList.remove(
          "active"
        );

      }
    );


  button
    .classList
    .add(
      "active"
    );


  buildStudyItems();

}


/* =========================
   BUILD
========================= */

function buildStudyItems() {

  studyItems = [];


  if (
    currentMode ===
      "basic"
    ||
    currentMode ===
      "jaen"
  ) {

    studyItems =
      words.map(
        function(word) {

          return {

            word: word,

            question:
              currentMode
              === "basic"
                ? word.english
                : word.japanese,

            answer:
              currentMode
              === "basic"
                ? word.japanese
                : word.english

          };

        }
      );

  }


  else if (
    currentMode ===
    "weak"
  ) {

    studyItems =
      words
        .filter(
          function(word) {

            return (
              weakWords
                .includes(
                  word.english
                )
            );

          }
        )
        .map(
          function(word) {

            return {

              word: word,

              question:
                word.english,

              answer:
                word.japanese

            };

          }
        );

  }


  else if (
    currentMode ===
    "verb"
  ) {

    words
      .filter(
        function(word) {

          return (
            word.partOfSpeech
            === "verb"
          );

        }
      )
      .forEach(
        function(word) {

          const f =
            word.forms || {};

          const base =
            f.base ||
            word.english;


          if (f.past) {

            studyItems.push({

              word: word,

              question:
                base,

              sub:
                "過去形は？",

              answer:
                f.past

            });

          }


          if (
            f.pastParticiple
          ) {

            studyItems.push({

              word: word,

              question:
                base,

              sub:
                "過去分詞は？",

              answer:
                f.pastParticiple

            });

          }


          if (f.ing) {

            studyItems.push({

              word: word,

              question:
                base,

              sub:
                "ing形は？",

              answer:
                f.ing

            });

          }


          if (
            f.thirdPerson
          ) {

            studyItems.push({

              word: word,

              question:
                base,

              sub:
                "三人称単数現在は？",

              answer:
                f.thirdPerson

            });

          }

        }
      );

  }


  else if (
    currentMode ===
    "adjective"
  ) {

    words
      .filter(
        function(word) {

          return (
            word.partOfSpeech
            ===
            "adjective"
          );

        }
      )
      .forEach(
        function(word) {

          const f =
            word.forms || {};

          const base =
            f.base ||
            word.english;


          if (
            f.comparative
          ) {

            studyItems.push({

              word: word,

              question:
                base,

              sub:
                "比較級は？",

              answer:
                f.comparative

            });

          }


          if (
            f.superlative
          ) {

            studyItems.push({

              word: word,

              question:
                base,

              sub:
                "最上級は？",

              answer:
                f.superlative

            });

          }

        }
      );

  }


  /* バグ対策 */
  if (
    current >=
    studyItems.length
  ) {

    current =
      0;

  }


  showCurrentItem();

}


/* =========================
   SHOW
========================= */

function showCurrentItem() {

  answerVisible =
    false;


  updateModeText();


  /* -----------------------
     0件の場合
  ----------------------- */

  if (
    studyItems.length
    === 0
  ) {

    document
      .getElementById(
        "questionLabel"
      )
      .textContent =
        "";


    document
      .getElementById(
        "questionMain"
      )
      .textContent =
        "学習する単語がありません";


    let message = "";


    if (
      currentMode ===
      "verb"
    ) {

      message =
        "管理画面で動詞と変化形を登録すると、ここで練習できます。";

    }

    else if (
      currentMode ===
      "adjective"
    ) {

      message =
        "管理画面で形容詞と比較級・最上級を登録すると、ここで練習できます。";

    }

    else if (
      currentMode ===
      "weak"
    ) {

      message =
        "苦手単語はありません 🎉";

    }

    else {

      message =
        "管理画面から単語を登録してください。";

    }


    document
      .getElementById(
        "questionSub"
      )
      .textContent =
        message;


    document
      .getElementById(
        "questionSpeaker"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "answerArea"
      )
      .innerHTML = `

        <span class="answer-hidden">
          －
        </span>

      `;


    document
      .getElementById(
        "mainAction"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "judgeButtons"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "bottomNav"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "infoContent"
      )
      .innerHTML = `

        <div class="empty-message">
          ${message}
        </div>

      `;


    updateProgress();

    return;

  }


  /* -----------------------
     通常表示へ戻す
  ----------------------- */

  document
    .getElementById(
      "mainAction"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "judgeButtons"
    )
    .style.display =
      "grid";


  document
    .getElementById(
      "bottomNav"
    )
    .style.display =
      "grid";


  const item =
    studyItems[current];


  document
    .getElementById(
      "questionLabel"
    )
    .textContent =
      getQuestionLabel(
        item
      );


  document
    .getElementById(
      "questionMain"
    )
    .textContent =
      item.question;


  document
    .getElementById(
      "questionSub"
    )
    .textContent =
      item.sub || "";


  document
    .getElementById(
      "questionSpeaker"
    )
    .style.display =
      currentMode ===
      "jaen"
        ? "none"
        : "block";


  renderAnswerArea();

  renderInfo(
    item.word
  );

  updateProgress();

}


/* =========================
   MODE TEXT
========================= */

function updateModeText() {

  let title = "";

  let description = "";


  if (
    currentMode ===
    "basic"
  ) {

    title =
      "基本単語モード";

    description =
      "英単語を見て、日本語の意味を考えましょう。";

  }


  else if (
    currentMode ===
    "jaen"
  ) {

    title =
      "日本語から英単語";

    description =
      "日本語を見て、英単語を考えましょう。";

  }


  else if (
    currentMode ===
    "verb"
  ) {

    title =
      "動詞の変化";

    description =
      "原形から過去形・過去分詞などを覚えましょう。";

  }


  else if (
    currentMode ===
    "adjective"
  ) {

    title =
      "形容詞の変化";

    description =
      "原級から比較級・最上級を覚えましょう。";

  }


  else {

    title =
      "苦手練習";

    description =
      "苦手に登録した単語だけを練習します。";

  }


  document
    .getElementById(
      "studyTitle"
    )
    .textContent =
      title;


  document
    .getElementById(
      "studyDescription"
    )
    .textContent =
      description;

}


/* =========================
   LABEL
========================= */

function getQuestionLabel(
  item
) {

  if (
    currentMode ===
    "basic"
  ) {

    return (
      "この英単語の意味は？"
    );

  }


  if (
    currentMode ===
    "jaen"
  ) {

    return (
      "この日本語を英語にすると？"
    );

  }


  if (
    currentMode ===
    "weak"
  ) {

    return (
      "苦手単語を復習しよう"
    );

  }


  return (
    item.sub || ""
  );

}


/* =========================
   ANSWER
========================= */

function renderAnswerArea() {

  if (
    studyItems.length
    === 0
  ) {
    return;
  }


  const area =
    document
      .getElementById(
        "answerArea"
      );


  if (
    !answerVisible
  ) {

    area.innerHTML = `

      <span class="answer-hidden">
        ？？？
      </span>

    `;


    document
      .getElementById(
        "mainAction"
      )
      .textContent =
        "👁 答えを見る";

  }

  else {

    const item =
      studyItems[current];


    const answerIsEnglish =
      (
        currentMode ===
          "jaen"
        ||
        currentMode ===
          "verb"
        ||
        currentMode ===
          "adjective"
      );


    if (
      answerIsEnglish
    ) {

      area.innerHTML = `

        <div class="answer-visible-row">

          <span>
            ${escapeHTML(
              item.answer
            )}
          </span>

          <button
            class="small-speaker"
            onclick="speakAnswer()">
            🔊
          </button>

        </div>

      `;

    }

    else {

      area.textContent =
        item.answer;

    }


    document
      .getElementById(
        "mainAction"
      )
      .textContent =
        "答えを表示中";

  }

}


function mainAction() {

  if (
    studyItems.length
    === 0
  ) {
    return;
  }


  answerVisible =
    true;


  renderAnswerArea();

}


/* =========================
   WEAK
========================= */

function markWeak() {

  if (
    studyItems.length
    === 0
  ) {
    return;
  }


  const english =
    studyItems[current]
      .word
      .english;


  if (
    !weakWords
      .includes(
        english
      )
  ) {

    weakWords.push(
      english
    );

  }


  saveWeakWords();

  nextWord();

}


function markRemembered() {

  if (
    studyItems.length
    === 0
  ) {
    return;
  }


  const english =
    studyItems[current]
      .word
      .english;


  weakWords =
    weakWords.filter(
      function(item) {

        return (
          item !==
          english
        );

      }
    );


  saveWeakWords();


  if (
    currentMode ===
    "weak"
  ) {

    buildStudyItems();

  }

  else {

    nextWord();

  }

}


function saveWeakWords() {

  localStorage.setItem(
    "weakWords",
    JSON.stringify(
      weakWords
    )
  );

}


/* =========================
   NAV
========================= */

function nextWord() {

  if (
    studyItems.length
    === 0
  ) {
    return;
  }


  current++;


  if (
    current >=
    studyItems.length
  ) {

    current =
      0;

  }


  showCurrentItem();

}


function previousWord() {

  if (
    studyItems.length
    === 0
  ) {
    return;
  }


  current--;


  if (
    current < 0
  ) {

    current =
      studyItems.length - 1;

  }


  showCurrentItem();

}


/* =========================
   PROGRESS
========================= */

function updateProgress() {

  const total =
    studyItems.length;


  const number =
    total === 0
      ? 0
      : current + 1;


  document
    .getElementById(
      "progressNumber"
    )
    .textContent =
      number
      + " / "
      + total;


  const percent =
    total === 0
      ? 0
      :
        (
          number /
          total
        )
        * 100;


  document
    .getElementById(
      "progressFill"
    )
    .style.width =
      percent + "%";

}


/* =========================
   INFO
========================= */

function renderInfo(
  word
) {

  const info =
    document
      .getElementById(
        "infoContent"
      );


  const f =
    word.forms || {
      base:
        word.english
    };


  const rows = [];


  if (
    word.partOfSpeech
    === "verb"
  ) {

    if (f.base) {
      rows.push(
        ["原形", f.base]
      );
    }

    if (f.past) {
      rows.push(
        ["過去形", f.past]
      );
    }

    if (
      f.pastParticiple
    ) {
      rows.push(
        [
          "過去分詞",
          f.pastParticiple
        ]
      );
    }

    if (f.ing) {
      rows.push(
        ["ing形", f.ing]
      );
    }

    if (
      f.thirdPerson
    ) {
      rows.push(
        [
          "三単現",
          f.thirdPerson
        ]
      );
    }

  }


  else if (
    word.partOfSpeech
    === "adjective"
  ) {

    if (f.base) {
      rows.push(
        ["原級", f.base]
      );
    }

    if (
      f.comparative
    ) {
      rows.push(
        [
          "比較級",
          f.comparative
        ]
      );
    }

    if (
      f.superlative
    ) {
      rows.push(
        [
          "最上級",
          f.superlative
        ]
      );
    }

  }


  else {

    rows.push(
      [
        "基本形",
        f.base ||
        word.english
      ]
    );

  }


  let formsHTML = `

    <div class="info-section">

      <div class="info-label">
        変化形
      </div>

      <div class="forms-box">

  `;


  rows.forEach(
    function(row) {

      formsHTML += `

        <div class="form-row">

          <div class="form-name">
            ${escapeHTML(
              row[0]
            )}
          </div>

          <div class="form-value">
            ${escapeHTML(
              row[1]
            )}
          </div>

          <div class="form-sound">

            <button
              onclick='speakEnglish(${JSON.stringify(row[1])})'>
              🔊
            </button>

          </div>

        </div>

      `;

    }
  );


  formsHTML += `

      </div>

    </div>

  `;


  const memo =
    memos[
      word.english
    ] || "";


  info.innerHTML = `

    <div class="info-word-row">

      <div class="info-word-main">

        <div class="info-word">
          ${escapeHTML(
            word.english
          )}
        </div>

        <button
          class="small-speaker"
          onclick='speakEnglish(${JSON.stringify(word.english)})'>
          🔊
        </button>

      </div>

      ${getBadge(
        word.partOfSpeech
      )}

    </div>


    <div class="info-section">

      <div class="info-label">
        日本語の意味
      </div>

      <div class="meaning-box">
        ${escapeHTML(
          word.japanese
        )}
      </div>

    </div>


    ${formsHTML}


    <div class="memo-box">

      <div class="memo-title">
        ✎ 自分メモ
      </div>

      <textarea
        id="memoInput"
        placeholder="覚え方、間違えやすいポイントなどを自由にメモできます。">${escapeHTML(
          memo
        )}</textarea>

      <button
        class="memo-save"
        onclick="saveMemo()">
        メモを保存
      </button>

    </div>

  `;

}


/* =========================
   MEMO
========================= */

function saveMemo() {

  if (
    studyItems.length
    === 0
  ) {
    return;
  }


  const word =
    studyItems[current]
      .word;


  const input =
    document
      .getElementById(
        "memoInput"
      );


  if (!input) {
    return;
  }


  memos[
    word.english
  ] =
    input.value;


  localStorage.setItem(
    "wordMemos",
    JSON.stringify(
      memos
    )
  );

}


/* =========================
   BADGE
========================= */

function getBadge(
  part
) {

  if (
    part === "verb"
  ) {

    return `
      <span class="badge badge-verb">
        動詞
      </span>
    `;

  }


  if (
    part === "noun"
  ) {

    return `
      <span class="badge badge-noun">
        名詞
      </span>
    `;

  }


  if (
    part ===
    "adjective"
  ) {

    return `
      <span class="badge badge-adjective">
        形容詞
      </span>
    `;

  }


  return `
    <span class="badge badge-other">
      その他
    </span>
  `;

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(
  text
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;

}


/* =========================
   START
========================= */

if (
  "speechSynthesis"
  in window
) {

  speechSynthesis
    .getVoices();

}


buildStudyItems();

</script>

</html>
