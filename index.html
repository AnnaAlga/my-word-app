<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY WORDS</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f7f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    .nav {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .nav a {
      text-decoration: none;
      background: #333;
      color: white;
      padding: 10px 16px;
      border-radius: 12px;
    }

    .card {
      background: white;
      padding: 30px;
      margin: 20px 0;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .word {
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .meaning {
      font-size: 24px;
      min-height: 35px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      border: none;
      border-radius: 15px;
      font-size: 16px;
      cursor: pointer;
    }

    .answer {
      background: #e7e7ff;
    }

    .next {
      background: #ddd;
    }

    .empty {
      color: #777;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>MY WORDS</h1>
  <p>わたしの英単語帳</p>

  <div class="nav">
    <a href="index.html">学習画面</a>
    <a href="admin.html">管理画面</a>
  </div>

  <div class="card" id="studyCard">

    <div class="word" id="word"></div>
    <div class="meaning" id="meaning"></div>

    <button class="answer" onclick="showAnswer()">
      答えを見る
    </button>

    <br>

    <button class="next" onclick="nextWord()">
      次の単語 →
    </button>

  </div>

</div>

<script>

let words = JSON.parse(localStorage.getItem("words")) || [
  {english:"apple", japanese:"りんご"},
  {english:"dog", japanese:"犬"},
  {english:"beautiful", japanese:"美しい"}
];

let current = 0;

function showWord() {

  const word = document.getElementById("word");
  const meaning = document.getElementById("meaning");

  if (words.length === 0) {
    word.textContent = "単語がありません";
    meaning.textContent = "管理画面から登録してください";
    return;
  }

  word.textContent = words[current].english;
  meaning.textContent = "？？？";
}

function showAnswer() {

  if (words.length === 0) return;

  document.getElementById("meaning").textContent =
    words[current].japanese;
}

function nextWord() {

  if (words.length === 0) return;

  current++;

  if (current >= words.length) {
    current = 0;
  }

  showWord();
}

showWord();

</script>

</body>
</html>
